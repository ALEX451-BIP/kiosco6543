        function productHasMinStock(p) { const s = getCigStock(p); return s.minimo > 0 && getTotalAtados(p) <= s.minimo; }

        // ---------- CIGARRILLO CAJA ----------
        function actualizarCigCajaSaldo() {
            let ef = 0, tr = 0;
            for (let m of cigCaja.movimientos) {
                if (m.tipo === 'ingreso') { if (m.metodo === 'efectivo') ef += m.monto; else tr += m.monto; }
                else if (m.tipo === 'retiro' || m.tipo === 'transferencia') { if (m.metodo === 'efectivo') ef -= m.monto; else tr -= m.monto; }
            }
            cigCaja.efectivo = Math.round(ef * 100) / 100;
            cigCaja.transferencia = Math.round(tr * 100) / 100;
        }

        function abrirCigCaja(ef, tr) {
            if (cigCaja.apertura) { toast("La caja de cigarrillos ya está abierta", true); return false; }
            if (ef < 0 || tr < 0) { toast("Montos no negativos", true); return false; }
            if (cigCaja.movimientos.length > 0) {
                if (!confirm("Hay movimientos sin cerrar. Se guardará un cierre automático. ¿Continuar?")) return false;
                if (!cigCaja.cierres) cigCaja.cierres = [];
                cigCaja.cierres.push({
                    fecha: new Date().toISOString(),
                    esperado: (cigCaja.efectivo || 0) + (cigCaja.transferencia || 0),
                    real: (cigCaja.efectivo || 0) + (cigCaja.transferencia || 0),
                    efEsperado: cigCaja.efectivo || 0, trEsperado: cigCaja.transferencia || 0,
                    efReal: cigCaja.efectivo || 0, trReal: cigCaja.transferencia || 0,
                    detalle: 'Cierre forzado automático', nota: 'Cierre auto antes de nueva apertura',
                    ventasDelDia: 0, cantidadVentas: 0, metodosPago: {}
                });
            }
            cigCaja.movimientos = [];
            cigCaja.efectivo = 0; cigCaja.transferencia = 0;
            cigCaja.montoAperturaEfectivo = 0; cigCaja.montoAperturaTransferencia = 0;
            if (ef > 0) cigCaja.movimientos.push({ fecha: new Date().toISOString(), tipo: "ingreso", monto: Math.round(ef * 100) / 100, descripcion: "Apertura caja cigarrillos", metodo: "efectivo" });
            if (tr > 0) cigCaja.movimientos.push({ fecha: new Date().toISOString(), tipo: "ingreso", monto: Math.round(tr * 100) / 100, descripcion: "Apertura caja cigarrillos", metodo: "transferencia" });
            cigCaja.apertura = new Date().toISOString();
            cigCaja.cerradaEn = null;
            cigCaja.montoAperturaEfectivo = Math.round(ef * 100) / 100;
            cigCaja.montoAperturaTransferencia = Math.round(tr * 100) / 100;
            cigCaja._version = Date.now() + Math.random();
            actualizarCigCajaSaldo(); saveCigCaja();
            toast("Caja cigarrillos abierta con $" + ef.toFixed(2) + " efectivo + $" + tr.toFixed(2) + " transf");
            return true;
        }

        function cigCajaTieneMovsHoy() {
            const hoy = toLocalDateStr(new Date());
            return cigCaja.movimientos.some(m => toLocalDateStr(m.fecha) === hoy);
        }

        async function cerrarCigCajaConArqueo() {
            if (!cigCaja.apertura) { toast("Caja cigarrillos ya cerrada", true); return; }
            actualizarCigCajaSaldo();
            const esperadoEf = cigCaja.efectivo, esperadoTr = cigCaja.transferencia, esperadoTotal = esperadoEf + esperadoTr;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:520px;">
                    <h3>🚬 Cierre Caja Cigarrillos</h3>
                    <p style="font-size:0.9rem; color:var(--text-muted);">Declara los montos reales:</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div><label>💰 Efectivo esperado: <strong>$${esperadoEf.toFixed(2)}</strong></label>
                            <input type="number" id="cigArqueoEf" step="0.01" min="0" value="${esperadoEf.toFixed(2)}"></div>
                        <div><label>💳 Transf. esperada: <strong>$${esperadoTr.toFixed(2)}</strong></label>
                            <input type="number" id="cigArqueoTr" step="0.01" min="0" value="${esperadoTr.toFixed(2)}"></div>
                    </div>
                    <div id="cigDiffArqueo" style="margin:10px 0; font-weight:700;"></div>
                    <label>Nota:</label><input type="text" id="cigNotaCierre" style="width:100%;">
                    <div style="display:flex; gap:14px; margin-top:18px;">
                        <button id="cigConfirmarCierre" class="btn btn-primary">Cerrar</button>
                        <button id="cigCancelarCierre" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            function calcDiff() {
                const efR = parseFloat(document.getElementById('cigArqueoEf').value) || 0;
                const trR = parseFloat(document.getElementById('cigArqueoTr').value) || 0;
                const diff = (efR + trR) - esperadoTotal;
                document.getElementById('cigDiffArqueo').innerHTML = diff === 0 ? '✅ Coincide' : (diff > 0 ? '⚠️ Sobran $' + diff.toFixed(2) : '⚠️ Faltan $' + Math.abs(diff).toFixed(2));
                return { efR, trR, diff };
            }
            document.getElementById('cigArqueoEf').oninput = calcDiff;
            document.getElementById('cigArqueoTr').oninput = calcDiff;
            calcDiff();
            document.getElementById('cigConfirmarCierre').onclick = () => {
                const { efR, trR, diff } = calcDiff();
                const nota = document.getElementById('cigNotaCierre').value.trim();
                if (!cigCaja.cierres) cigCaja.cierres = [];
                const cierre = {
                    fecha: new Date().toISOString(), esperado: esperadoTotal, real: efR + trR,
                    efEsperado: esperadoEf, trEsperado: esperadoTr, efReal: efR, trReal: trR,
                    detalle: 'Ef: $' + esperadoEf.toFixed(2) + '→$' + efR.toFixed(2) + ' | Tr: $' + esperadoTr.toFixed(2) + '→$' + trR.toFixed(2),
                    nota, ventasDelDia: 0, cantidadVentas: 0, metodosPago: {}
                };
                if (Math.abs(diff) > 0.001 && confirm('¿Registrar ajuste de $' + Math.abs(diff).toFixed(2) + '?')) {
                    const t = diff > 0 ? 'retiro' : 'ingreso';
                    cigCaja.movimientos.push({ fecha: new Date().toISOString(), tipo: t, monto: Math.abs(diff), descripcion: 'Ajuste arqueo cigarrillos', metodo: 'efectivo' });
                    cierre.ajuste = { tipo: t, monto: Math.abs(diff) };
                    actualizarCigCajaSaldo();
                }
                cigCaja.cierres.push(cierre);
                cigCaja.apertura = null; cigCaja.cerradaEn = new Date().toISOString(); cigCaja.montoAperturaEfectivo = 0; cigCaja.montoAperturaTransferencia = 0;
                cigCaja.efectivo = 0; cigCaja.transferencia = 0; cigCaja.movimientos = [];
                cigCaja._version = Date.now() + Math.random();
                saveCigCaja(); modal.remove(); renderCigarrillos();
                toast("🚬 Caja cigarrillos cerrada");
            };
            document.getElementById('cigCancelarCierre').onclick = () => modal.remove();
        }

        function transferirCigACajaGeneral(monto, metodo) {
            if (!cigCaja.apertura) { toast("Caja cigarrillos cerrada", true); return false; }
            if (monto <= 0) { toast("Monto inválido", true); return false; }
            const disponible = metodo === 'efectivo' ? cigCaja.efectivo : cigCaja.transferencia;
            if (monto > disponible) { toast("No hay suficiente saldo en cigarrillos", true); return false; }
            cigCaja.movimientos.push({ fecha: new Date().toISOString(), tipo: 'transferencia', monto, descripcion: 'Transferencia a Caja General', metodo });
            if (!caja.apertura) {
                if (!confirm("La caja general está cerrada. ¿Abrirla con $" + monto.toFixed(2) + "?")) return false;
                abrirCaja(metodo === 'efectivo' ? monto : 0, metodo === 'transferencia' ? monto : 0);
                toast("Caja general abierta con la transferencia");
            } else {
                caja.movimientos.push({ fecha: new Date().toISOString(), tipo: 'ingreso', monto, descripcion: 'Transferencia desde Caja Cigarrillos', metodo });
                actualizarSaldoCaja(); saveAll();
            }
            if (!cigCaja.transferenciasACajaGeneral) cigCaja.transferenciasACajaGeneral = [];
            cigCaja.transferenciasACajaGeneral.push({ fecha: new Date().toISOString(), monto, metodo });
            actualizarCigCajaSaldo(); saveCigCaja(); renderCigarrillos();
            toast("✅ Transferidos $" + monto.toFixed(2) + " a caja general");
            return true;
        }

            const totalStats = ventasStats.reduce((s, v) => s + v.total, 0);
            const gananciaStats = ventasStats.reduce((s, v) => s + (v.ganancia || 0), 0);
            const ticketProm = ventasStats.length ? totalStats / ventasStats.length : 0;
            const ultimasVentas = cigVentas.slice(0, 20);
            const movCig = cigCaja.movimientos.filter(m => toLocalDateStr(new Date(m.fecha)) === hoy);

                    <div class="kpi-card"><div class="kpi-title">📈 Ganancia neta</div><div class="kpi-value">$${totalGanancia.toFixed(2)}</div></div>

                    <div class="kpi-card" style="background:var(--accent-light);border:2px solid var(--accent);"><div class="kpi-title">💰 Ventas HOY</div><div class="kpi-value" style="color:var(--text);">$${totalHoy.toFixed(2)}</div></div>
                    <div class="kpi-card" style="background:var(--accent-light);border:2px solid var(--accent);"><div class="kpi-title">📈 Ganancia HOY</div><div class="kpi-value" style="color:var(--text);">$${gananciaHoy.toFixed(2)}</div></div>
                    <div class="kpi-card" style="background:var(--accent-light);border:2px solid var(--accent);"><div class="kpi-title">💰 Efectivo cig.</div><div class="kpi-value" style="color:var(--text);">$${cigEf.toFixed(2)}</div></div>
                    <div class="kpi-card" style="background:var(--accent-light);border:2px solid var(--accent);"><div class="kpi-title">💳 Transf. cig.</div><div class="kpi-value" style="color:var(--text);">$${cigTr.toFixed(2)}</div></div>
                </div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">

                                return `<tr><td>${f}</td><td>$${v.total.toFixed(2)}</td><td style="color:var(--primary);font-weight:700;">$${cigT.toFixed(2)}</td><td>$${(v.ganancia||0).toFixed(2)}</td><td>${v.metodoPago||'Efectivo'}</td></tr>`;

                        </table>
                    </div>
                </div>
            `;

                const el = document.getElementById('cigPeriod'+d);

        }

            document.getElementById("cigStockAjusteBtn")?.addEventListener("click", () => {

                document.body.appendChild(m);

                    if (!prod) return;
                    const oldS = getCigStock(prod);
                    prod.stockCartones = cart; prod.stockAtados = at;
                    cigMovimientosStock.push({ fecha: new Date().toISOString(), productoId: id, productoNombre: prod.nombre, tipo: 'ajuste', cartones: cart - oldS.cartones, atados: at - oldS.atados, descripcion: motivo });

            document.getElementById("cigStockConversionBtn")?.addEventListener("click", () => {
                const opts = cigProducts.map(p => {
                    const s = getCigStock(p);
                    return `<option value="${p.id}">${escapeHtml(p.nombre)} (${s.cartones} cart. / ${s.atados} at.)</option>`;
                }).join('');
                const m = document.createElement('div'); m.className = 'modal-overlay';
                m.innerHTML = `<div class="modal-card"><h3>🔄 Convertir cartones ⇄ atados</h3>
                    <select id="cigConvProd">${opts}</select>
                    <label>Dirección:</label>
                    <select id="cigConvDir"><option value="a2c">Atados → Cartones</option><option value="c2a">Cartones → Atados</option></select>

                    <div style="display:flex;gap:14px;margin-top:18px;"><button id="cigConvGuardar" class="btn btn-primary">Convertir</button><button id="cigConvCancel" class="btn btn-outline">Cancelar</button></div></div>`;
                document.body.appendChild(m);
                document.getElementById('cigConvGuardar').onclick = () => {
                    const id = parseInt(document.getElementById('cigConvProd').value);
                    const dir = document.getElementById('cigConvDir').value;
                    const cant = parseInt(document.getElementById('cigConvCant').value) || 0;
                    const prod = productos.find(p => p.id === id);
                    if (!prod || cant <= 0) { toast("Inválido", true); return; }
                    const s = getCigStock(prod);
                    const apc = s.atadosPorCarton;
                    if (dir === 'a2c') {
                        const needed = cant;
                        if (s.atados < needed) { toast("No hay suficientes atados", true); return; }
                        const newCart = Math.floor(cant / apc);
                        const restAt = cant % apc;
                        prod.stockAtados = s.atados - cant;
                        prod.stockCartones = (s.cartones || 0) + newCart;
                        const sobrantes = restAt;
                        if (sobrantes > 0) prod.stockAtados += sobrantes;
                        cigMovimientosStock.push({ fecha: new Date().toISOString(), productoId: id, productoNombre: prod.nombre, tipo: 'conversion', cartones: newCart, atados: -(cant - restAt), descripcion: 'Convertido ' + cant + ' at. → ' + newCart + ' cart.' + (restAt ? ' (sobraron ' + restAt + ' at.)' : '') });
                    } else {
                        const needed = cant;
                        if ((s.cartones || 0) < needed) { toast("No hay suficientes cartones", true); return; }
                        const newAt = needed * apc;
                        prod.stockCartones = (s.cartones || 0) - needed;
                        prod.stockAtados = (s.atados || 0) + newAt;
                        cigMovimientosStock.push({ fecha: new Date().toISOString(), productoId: id, productoNombre: prod.nombre, tipo: 'conversion', cartones: -needed, atados: newAt, descripcion: 'Convertido ' + needed + ' cart. → ' + newAt + ' at.' });
                    }
                    saveAll(); saveCigMovimientosStock(); m.remove(); renderCigarrillos();
                    toast("Conversión realizada");
                };
                document.getElementById('cigConvCancel').onclick = () => m.remove();
            });

                prod.stockCartones = (prod.stockCartones !== undefined ? prod.stockCartones : 0) + cart;
                prod.stockAtados = (prod.stockAtados !== undefined ? prod.stockAtados : prod.stock) + at;
                if (precio > 0) prod.costo = precio;
                cigMovimientosStock.push({ fecha: new Date().toISOString(), productoId: id, productoNombre: prod.nombre, tipo: 'compra', cartones: cart, atados: at, descripcion: nota + (precio > 0 ? ' - $' + precio.toFixed(2) + '/at' : '') });
                saveAll(); saveCigMovimientosStock(); m.remove(); renderCigarrillos();
                toast("Stock agregado: +" + cart + " cart. +" + at + " at.");
            };
            document.getElementById('cigEntradaCancel').onclick = () => m.remove();

        // ---------- COMPRAS ----------
        function renderCigComprasSection(cigProducts) {
            const html = `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">

                            return `<tr><td>${new Date(c.fecha).toLocaleString()}</td><td>${escapeHtml(c.proveedorNombre||'')}</td><td>${escapeHtml(c.numeroFactura||'-')}</td><td>${escapeHtml(c.productoNombre||'')}</td><td>${c.cartones||0}</td><td>${c.atados||0}</td><td>$${(c.precioUnitario||0).toFixed(2)}</td><td>$${(c.total||0).toFixed(2)}</td></tr>`;

                    </div>

                    <label>N° Factura:</label><input type="text" id="cigCompraFactura">

                    if (cart <= 0 && at <= 0) { toast("Agrega cartones o atados", true); return; }

                    const totalAt = cart * (prod.atadosPorCarton || getCigConfig().atadosPorCarton) + at;

        // ---------- GANANCIAS ----------
        function renderCigGananciasSection(cigProducts, cigVentas) {
            const cigIds = cigProducts.map(p => p.id);
            const periodoActivo = parseInt(localStorage.getItem('cigGananciaPeriod') || '30');
            const fechaInicio = new Date(); fechaInicio.setDate(fechaInicio.getDate() - periodoActivo); fechaInicio.setHours(0,0,0,0);
            const ventasFilt = cigVentas.filter(v => new Date(v.fecha) >= fechaInicio);
            const totalVentas = ventasFilt.reduce((s, v) => s + v.total, 0);
            const totalGanancia = ventasFilt.reduce((s, v) => s + (v.ganancia || 0), 0);
            const margen = totalVentas > 0 ? (totalGanancia / totalVentas * 100) : 0;

            // Ganancia por marca
            let marcaMap = {};
            ventasFilt.forEach(v => {
                v.items.forEach(item => {
                    if (cigIds.includes(item.id) || esItemCigarrillo(item)) {
                        const p = productos.find(pr => pr.id === item.id);
                        const marca = (p && p.marca) ? p.marca : (p ? p.nombre : item.nombre);
                        const gan = (item.precioUnitario - (p?.costo || 0)) * item.cantidad;
                        if (!marcaMap[marca]) marcaMap[marca] = { ventas: 0, ganancia: 0, unidades: 0, costo: 0 };
                        marcaMap[marca].ventas += item.subtotal;
                        marcaMap[marca].ganancia += gan;
                        marcaMap[marca].unidades += item.cantidad;
                        marcaMap[marca].costo += (p?.costo || 0) * item.cantidad;
                    }
                });
            });
            const marcasArr = Object.entries(marcaMap).sort((a, b) => b[1].ganancia - a[1].ganancia);

            // Ganancia diaria
            let diasMap = new Map();
            for (let d = new Date(fechaInicio); d <= new Date(); d.setDate(d.getDate() + 1)) {
                diasMap.set(d.toISOString().split('T')[0], { ventas: 0, ganancia: 0, margen: 0 });
            }
            ventasFilt.forEach(v => {
                const key = new Date(v.fecha).toISOString().split('T')[0];
                if (diasMap.has(key)) {
                    const d = diasMap.get(key);
                    d.ventas += v.total;
                    d.ganancia += v.ganancia || 0;
                }
            });

            const sortedDias = Array.from(diasMap.keys()).sort();
            const ventasDiarias = sortedDias.map(d => diasMap.get(d).ventas);
            const gananciasDiarias = sortedDias.map(d => diasMap.get(d).ganancia);
            const labels = sortedDias.map(d => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short' }));

            // Totales semanales/mensuales
            const totalSemana = ventasFilt.filter(v => { const d = new Date(v.fecha); const now = new Date(); const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7); return d >= weekAgo; });
            const totalMes = ventasFilt.filter(v => { const d = new Date(v.fecha); const now = new Date(); const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth() - 1); return d >= monthAgo; });
            const ganSemana = totalSemana.reduce((s, v) => s + (v.ganancia || 0), 0);
            const ganMes = totalMes.reduce((s, v) => s + (v.ganancia || 0), 0);
            const venSemana = totalSemana.reduce((s, v) => s + v.total, 0);
            const venMes = totalMes.reduce((s, v) => s + v.total, 0);

            // Rentabilidad por proveedor
            let provMap = {};
            ventasFilt.forEach(v => {
                v.items.forEach(item => {
                    if (cigIds.includes(item.id) || esItemCigarrillo(item)) {
                        const p = productos.find(pr => pr.id === item.id);
                        const provId = p?.proveedorId;
                        const provName = provId ? (proveedores.find(pr => pr.id === provId)?.nombre || proveedores.find(pr => pr.id === provId)?.empresa || 'Sin proveedor') : 'Sin proveedor';
                        const gan = (item.precioUnitario - (p?.costo || 0)) * item.cantidad;
                        if (!provMap[provName]) provMap[provName] = { ventas: 0, ganancia: 0, margen: 0 };
                        provMap[provName].ventas += item.subtotal;
                        provMap[provName].ganancia += gan;
                    }
                });
            });
            Object.keys(provMap).forEach(k => { provMap[k].margen = provMap[k].ventas > 0 ? (provMap[k].ganancia / provMap[k].ventas * 100) : 0; });

            const html = `
                <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                    <button id="cigGan7" class="btn ${periodoActivo===7?'btn-primary':'btn-outline'}">7 días</button>
                    <button id="cigGan30" class="btn ${periodoActivo===30?'btn-primary':'btn-outline'}">30 días</button>
                    <button id="cigGan90" class="btn ${periodoActivo===90?'btn-primary':'btn-outline'}">90 días</button>
                    <button id="cigGanAll" class="btn ${periodoActivo===99999?'btn-primary':'btn-outline'}">Todo</button>
                </div>
                <div class="stats-kpi-grid" style="margin-bottom:16px;">
                    <div class="kpi-card"><div class="kpi-title">💰 Ventas período</div><div class="kpi-value">$${totalVentas.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">📈 Ganancia neta</div><div class="kpi-value">$${totalGanancia.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">📊 Margen</div><div class="kpi-value">${margen.toFixed(1)}%</div></div>
                </div>
                <div class="stats-kpi-grid" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
                    <div class="kpi-card"><div class="kpi-title">📈 Ganancia semanal</div><div class="kpi-value">$${ganSemana.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">📈 Ganancia mensual</div><div class="kpi-value">$${ganMes.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">💰 Ventas semanales</div><div class="kpi-value">$${venSemana.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">💰 Ventas mensuales</div><div class="kpi-value">$${venMes.toFixed(2)}</div></div>
                </div>
                <div class="charts-grid" style="margin-bottom:16px;">
                    <div class="chart-container"><h4>📈 Ganancia diaria</h4><canvas id="cigGanLineChart" width="400" height="200"></canvas></div>
                    <div class="chart-container"><h4>🏆 Ganancia por marca</h4><canvas id="cigGanBarChart" width="400" height="200"></canvas></div>
                </div>
                <div style="margin-bottom:16px;">
                    <h4>🏆 Ganancia por marca</h4>
                    <div class="table-responsive">
                        <table class="table"><thead><tr><th>Marca</th><th>Unidades</th><th>Ventas</th><th>Ganancia</th><th>Margen</th></tr></thead>
                            <tbody>${marcasArr.map(([marca, d]) => `<tr><td>${escapeHtml(marca)}</td><td>${d.unidades}</td><td>$${d.ventas.toFixed(2)}</td><td>$${d.ganancia.toFixed(2)}</td><td>${d.ventas > 0 ? (d.ganancia/d.ventas*100).toFixed(1) : '0'}%</td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <h4>📊 Rentabilidad por proveedor</h4>
                    <div class="table-responsive">
                        <table class="table"><thead><tr><th>Proveedor</th><th>Ventas</th><th>Ganancia</th><th>Margen</th></tr></thead>
                            <tbody>${Object.entries(provMap).sort((a,b) => b[1].ganancia - a[1].ganancia).map(([prov, d]) => `<tr><td>${escapeHtml(prov)}</td><td>$${d.ventas.toFixed(2)}</td><td>$${d.ganancia.toFixed(2)}</td><td>${d.margen.toFixed(1)}%</td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
            document.getElementById("cigSubContent").innerHTML = html;
            [7,30,90,99999].forEach((d,i) => {
                const ids = ['cigGan7','cigGan30','cigGan90','cigGanAll'];
                const el = document.getElementById(ids[i]);
                if (el) el.onclick = () => { localStorage.setItem('cigGananciaPeriod', d); renderCigarrillos(); };
            });

            if (window._cigGanLineChart) window._cigGanLineChart.destroy();
            const ctxLine = document.getElementById('cigGanLineChart')?.getContext('2d');
            if (ctxLine) window._cigGanLineChart = new Chart(ctxLine, {
                type: 'line', data: { labels, datasets: [
                    { label: 'Ventas ($)', data: ventasDiarias, borderColor: '#d63384', backgroundColor: 'rgba(214,51,132,0.1)', tension: 0.3, fill: true },
                    { label: 'Ganancia ($)', data: gananciasDiarias, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.3, fill: true }
                ]}, options: { responsive: true, maintainAspectRatio: true }
            });

            if (window._cigGanBarChart) window._cigGanBarChart.destroy();
            const ctxBar = document.getElementById('cigGanBarChart')?.getContext('2d');
            if (ctxBar) window._cigGanBarChart = new Chart(ctxBar, {
                type: 'bar', data: {
                    labels: marcasArr.slice(0, 8).map(([m]) => m),
                    datasets: [
                        { label: 'Ganancia ($)', data: marcasArr.slice(0, 8).map(([,d]) => d.ganancia), backgroundColor: '#10b981' },
                        { label: 'Ventas ($)', data: marcasArr.slice(0, 8).map(([,d]) => d.ventas), backgroundColor: '#d63384' }
                    ]
                }, options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } }
            });
        }

        // ---------- ESTADÍSTICAS ----------
        function renderCigEstadisticasSection(cigProducts, cigVentas) {
            const cigIds = cigProducts.map(p => p.id);
            const periodo = parseInt(localStorage.getItem('cigStatsPeriod2') || '30');
            const fechaInicio = new Date(); fechaInicio.setDate(fechaInicio.getDate() - periodo); fechaInicio.setHours(0,0,0,0);
            const ventasFilt = cigVentas.filter(v => new Date(v.fecha) >= fechaInicio);

            // Marcas más vendidas
            let brandUnits = {};
            let brandSales = {};
            ventasFilt.forEach(v => {
                v.items.forEach(item => {
                    if (cigIds.includes(item.id) || esItemCigarrillo(item)) {
                        const p = productos.find(pr => pr.id === item.id);
                        const marca = (p && p.marca) ? p.marca : (p ? p.nombre : item.nombre);
                        brandUnits[marca] = (brandUnits[marca] || 0) + item.cantidad;
                        brandSales[marca] = (brandSales[marca] || 0) + item.subtotal;
                    }
                });
            });
            const topBrands = Object.entries(brandUnits).sort((a, b) => b[1] - a[1]).slice(0, 10);

            // Productos sin movimiento
            const movedProdIds = new Set();
            ventasFilt.forEach(v => v.items.forEach(item => { if (cigIds.includes(item.id)) movedProdIds.add(item.id); }));
            const sinMovimiento = cigProducts.filter(p => !movedProdIds.has(p.id));

            // Horas más ventas
            let hourSales = new Array(24).fill(0);
            let hourCount = new Array(24).fill(0);
            ventasFilt.forEach(v => {
                const h = new Date(v.fecha).getHours();
                hourSales[h] += v.total;
                hourCount[h]++;
            });
            const peakHour = hourSales.indexOf(Math.max(...hourSales));

            // Días con mayores ventas
            let daySales = {};
            ventasFilt.forEach(v => {
                const d = toLocalDateStr(new Date(v.fecha));
                daySales[d] = (daySales[d] || 0) + v.total;
            });
            const topDays = Object.entries(daySales).sort((a, b) => b[1] - a[1]).slice(0, 10);

            // Mes actual vs anterior
            const now = new Date();
            const mesActual = now.getMonth();
            const anoActual = now.getFullYear();
            const mesAnt = mesActual === 0 ? 11 : mesActual - 1;
            const anoAnt = mesActual === 0 ? anoActual - 1 : anoActual;
            const ventasMesActual = cigVentas.filter(v => {
                const d = new Date(v.fecha); return d.getMonth() === mesActual && d.getFullYear() === anoActual && !v.devuelta;
            }).reduce((s, v) => s + v.total, 0);
            const ventasMesAnt = cigVentas.filter(v => {
                const d = new Date(v.fecha); return d.getMonth() === mesAnt && d.getFullYear() === anoAnt && !v.devuelta;
            }).reduce((s, v) => s + v.total, 0);
            const diffMes = ventasMesActual - ventasMesAnt;
            const pctMes = ventasMesAnt > 0 ? (diffMes / ventasMesAnt * 100) : 0;

            // Días de la semana
            const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            let dayOfWeekSales = new Array(7).fill(0);
            ventasFilt.forEach(v => { dayOfWeekSales[new Date(v.fecha).getDay()] += v.total; });

            const html = `
                <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                    <button id="cigEst7" class="btn ${periodo===7?'btn-primary':'btn-outline'}">7d</button>
                    <button id="cigEst30" class="btn ${periodo===30?'btn-primary':'btn-outline'}">30d</button>
                    <button id="cigEst90" class="btn ${periodo===90?'btn-primary':'btn-outline'}">90d</button>
                    <button id="cigEstAll" class="btn ${periodo===99999?'btn-primary':'btn-outline'}">Todo</button>
                </div>
                <div class="stats-kpi-grid" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
                    <div class="kpi-card"><div class="kpi-title">⏰ Hora pico</div><div class="kpi-value">${peakHour}:00 hs</div></div>
                    <div class="kpi-card"><div class="kpi-title">📅 Mes actual vs anterior</div><div class="kpi-value" style="color:${diffMes >= 0 ? 'var(--success)' : 'var(--danger)'}">${pctMes >= 0 ? '+' : ''}${pctMes.toFixed(1)}%</div></div>
                    <div class="kpi-card"><div class="kpi-title">💰 Mes actual</div><div class="kpi-value">$${ventasMesActual.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">💰 Mes anterior</div><div class="kpi-value">$${ventasMesAnt.toFixed(2)}</div></div>
                </div>
                <div class="charts-grid" style="margin-bottom:16px;">
                    <div class="chart-container"><h4>📈 Tendencia de ventas</h4><canvas id="cigEstLineChart" width="400" height="200"></canvas></div>
                    <div class="chart-container"><h4>⏰ Ventas por hora</h4><canvas id="cigEstHourChart" width="400" height="200"></canvas></div>
                    <div class="chart-container"><h4>📅 Ventas por día de semana</h4><canvas id="cigEstDayChart" width="400" height="200"></canvas></div>
                    <div class="chart-container"><h4>🏆 Top marcas (unidades)</h4><canvas id="cigEstBrandChart" width="400" height="200"></canvas></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                    <div>
                        <h4>🏆 Top marcas más vendidas</h4>
                        <div class="table-responsive">
                            <table class="table"><thead><tr><th>Marca</th><th>Unidades</th><th>Ventas</th></tr></thead>
                                <tbody>${topBrands.map(([m, u]) => `<tr><td>${escapeHtml(m)}</td><td>${u}</td><td>$${(brandSales[m]||0).toFixed(2)}</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                    <div>
                        <h4>📅 Top 10 días con mayores ventas</h4>
                        <div class="table-responsive">
                            <table class="table"><thead><tr><th>Fecha</th><th>Ventas</th></tr></thead>
                                <tbody>${topDays.map(([d, s]) => `<tr><td>${d}</td><td>$${(s||0).toFixed(2)}</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
                ${sinMovimiento.length ? `<div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:16px;"><h4>⚠️ Productos sin movimiento (${sinMovimiento.length})</h4><p>${sinMovimiento.map(p => escapeHtml(p.nombre)).join(', ')}</p></div>` : ''}
            `;
            document.getElementById("cigSubContent").innerHTML = html;
            [7,30,90,99999].forEach((d,i) => {
                const ids = ['cigEst7','cigEst30','cigEst90','cigEstAll'];
                const el = document.getElementById(ids[i]);
                if (el) el.onclick = () => { localStorage.setItem('cigStatsPeriod2', d); renderCigarrillos(); };
            });

            // Charts
            const sortedVentas = ventasFilt.slice().sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            let fechasMap = new Map();
            for (let d = new Date(fechaInicio); d <= new Date(); d.setDate(d.getDate()+1)) fechasMap.set(d.toISOString().split('T')[0], 0);
            sortedVentas.forEach(v => { const k = new Date(v.fecha).toISOString().split('T')[0]; if (fechasMap.has(k)) fechasMap.set(k, fechasMap.get(k) + v.total); });
            const sortedDates = Array.from(fechasMap.keys()).sort();
            const ventasData = sortedDates.map(d => fechasMap.get(d));
            const lbls = sortedDates.map(d => new Date(d).toLocaleDateString('es', {day:'numeric',month:'short'}));

            if (window._cigEstLineChart) window._cigEstLineChart.destroy();
            const ctxL = document.getElementById('cigEstLineChart')?.getContext('2d');
            if (ctxL) window._cigEstLineChart = new Chart(ctxL, { type: 'line', data: { labels: lbls, datasets: [{ label: 'Ventas ($)', data: ventasData, borderColor: '#d63384', tension: 0.3, fill: true, backgroundColor: 'rgba(214,51,132,0.1)' }] }, options: { responsive: true, maintainAspectRatio: true } });

            if (window._cigEstHourChart) window._cigEstHourChart.destroy();
            const ctxH = document.getElementById('cigEstHourChart')?.getContext('2d');
            if (ctxH) window._cigEstHourChart = new Chart(ctxH, { type: 'bar', data: { labels: Array.from({length:24},(_,i)=>i+':00'), datasets: [{ label: 'Ventas ($)', data: hourSales, backgroundColor: '#d63384' }] }, options: { responsive: true, maintainAspectRatio: true } });

            if (window._cigEstDayChart) window._cigEstDayChart.destroy();
            const ctxD = document.getElementById('cigEstDayChart')?.getContext('2d');
            if (ctxD) window._cigEstDayChart = new Chart(ctxD, { type: 'bar', data: { labels: dayNames, datasets: [{ label: 'Ventas ($)', data: dayOfWeekSales, backgroundColor: '#f59e0b' }] }, options: { responsive: true, maintainAspectRatio: true } });

            if (window._cigEstBrandChart) window._cigEstBrandChart.destroy();
            const ctxB = document.getElementById('cigEstBrandChart')?.getContext('2d');
            if (ctxB) window._cigEstBrandChart = new Chart(ctxB, { type: 'bar', data: { labels: topBrands.slice(0, 8).map(([m]) => m), datasets: [{ label: 'Unidades', data: topBrands.slice(0, 8).map(([,u]) => u), backgroundColor: '#10b981' }] }, options: { responsive: true, maintainAspectRatio: true } });
        }

        // ---------- EXPOSE TO GLOBAL (module scope → window) ----------
        window.renderCigarrillos = renderCigarrillos;
        window.esItemCigarrillo = esItemCigarrillo;
        window.getCigConfig = getCigConfig;
        window.actualizarCigCajaSaldo = actualizarCigCajaSaldo;
        window.saveCigCaja = saveCigCaja;
        window.saveCigCompras = saveCigCompras;
        window.saveCigMovimientosStock = saveCigMovimientosStock;
        window.tieneProductosCigarrillos = tieneProductosCigarrillos;
        window.getProductosCigarrillos = getProductosCigarrillos;
        window.getVentasCigarrillos = getVentasCigarrillos;
        window.getCigStock = getCigStock;
        window.getTotalAtados = getTotalAtados;
        window.productHasMinStock = productHasMinStock;
        window.abrirCigCaja = abrirCigCaja;
        window.cerrarCigCajaConArqueo = cerrarCigCajaConArqueo;
        window.transferirCigACajaGeneral = transferirCigACajaGeneral;
        window.cigCajaTieneMovsHoy = cigCajaTieneMovsHoy;

        // ---------- CHARTS (shared) ----------
        function renderCigCharts(cigVentas, cigProducts, dias) {
            const ahora = new Date();
            const fechaInicio = new Date(); fechaInicio.setDate(ahora.getDate() - dias); fechaInicio.setHours(0,0,0,0);
            const ventasFiltradas = cigVentas.filter(v => new Date(v.fecha) >= fechaInicio).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
            const cigIds = cigProducts.map(p => p.id);
            let fechasMap = new Map();
            for (let d = new Date(fechaInicio); d <= ahora; d.setDate(d.getDate() + 1)) fechasMap.set(d.toISOString().split('T')[0], { ventas: 0, ganancia: 0 });
            ventasFiltradas.forEach(v => {
                let key = new Date(v.fecha).toISOString().split('T')[0];
                if (fechasMap.has(key)) { let item = fechasMap.get(key); let ct = v.desglose ? v.desglose.cigarrillos : v.total; item.ventas += ct; item.ganancia += v.ganancia || 0; }
            });
            let sortedDates = Array.from(fechasMap.keys()).sort();
            let ventasData = sortedDates.map(d => fechasMap.get(d).ventas);
            let labels = sortedDates.map(d => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short' }));
            if (window._cigLineChart) window._cigLineChart.destroy();
            let ctxLine = document.getElementById('cigLineChart')?.getContext('2d');
            if (ctxLine) window._cigLineChart = new Chart(ctxLine, { type: 'line', data: { labels, datasets: [{ label: 'Ventas cigarrillos ($)', data: ventasData, borderColor: '#d63384', backgroundColor: 'rgba(214,51,132,0.1)', tension: 0.3, fill: true }] }, options: { responsive: true, maintainAspectRatio: true } });
            let metodos = {};
            ventasFiltradas.forEach(v => { let met = v.metodoPago || 'efectivo'; let monto = v.desglose ? v.desglose.cigarrillos : v.total; metodos[met] = (metodos[met] || 0) + monto; });
            let pieLabels = Object.keys(metodos), pieData = Object.values(metodos);
            if (window._cigPieChart) window._cigPieChart.destroy();
            let ctxPie = document.getElementById('cigPieChart')?.getContext('2d');
            if (ctxPie) window._cigPieChart = new Chart(ctxPie, { type: 'pie', data: { labels: pieLabels, datasets: [{ data: pieData, backgroundColor: ['#d63384','#ffab00','#10b981','#3b82f6','#8b5cf6'] }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } } });
            let prodMap = new Map();
            ventasFiltradas.forEach(v => { v.items.forEach(item => { if (cigIds.includes(item.id) || esItemCigarrillo(item)) prodMap.set(item.nombre, (prodMap.get(item.nombre) || 0) + item.cantidad); }); });
            let topProd = Array.from(prodMap.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);
            if (window._cigBarChart) window._cigBarChart.destroy();
            let ctxBar = document.getElementById('cigBarChart')?.getContext('2d');
            if (ctxBar) window._cigBarChart = new Chart(ctxBar, { type: 'bar', data: { labels: topProd.map(p => p[0]), datasets: [{ label: 'Unidades', data: topProd.map(p => p[1]), backgroundColor: '#d63384' }] }, options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } } });
            let gananciasData = sortedDates.map(d => fechasMap.get(d).ganancia);
            if (window._cigDualChart) window._cigDualChart.destroy();
            let ctxDual = document.getElementById('cigDualChart')?.getContext('2d');
            if (ctxDual) window._cigDualChart = new Chart(ctxDual, { type: 'bar', data: { labels, datasets: [{ label: 'Ventas cigarrillos ($)', data: ventasData, backgroundColor: '#d63384' }, { label: 'Ganancia ($)', data: gananciasData, backgroundColor: '#f59e0b' }] }, options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } } });
        }

        window.addEventListener('load', () => {
            // Solo carga datos de Firebase si NO hay datos locales,
            // para evitar borrar lo que el usuario ya guardó
            const pref = "kiosco_pro_ultimate_";
            get(dataRef).then(snapshot => {
                if (!snapshot.exists()) return;
                const fbData = snapshot.val();
                let changed = false;
                const keys = ['clientes','productos','ventas','caja','negocio','config','categorias','empleados','turnos','auditoriaBorrados','carteles','plantillasCarteles','etiquetasGuardadas','turnosCaja','gastos','proveedores','cigCaja','cigCompras','cigMovimientosStock','subeCargas'];
                keys.forEach(k => {
                    if (!localStorage.getItem(pref + k) && fbData[k]) {
                        if (k === 'caja' && window.caja && window.caja.cerradaEn) {
                            // No restaurar caja si fue cerrada localmente
                        } else if (Array.isArray(window[k])) {
                            window[k].splice(0, window[k].length, ...fbData[k]);
                        } else if (typeof window[k] === 'object' && window[k] !== null) {
                            Object.assign(window[k], fbData[k]);
                        }
                        changed = true;
                    }
                });

                if (changed) {
                    if (window.actualizarSaldoCaja) window.actualizarSaldoCaja();
                    originalSaveAll();
                    if (window.refreshCurrentTab) window.refreshCurrentTab();
                    if (window.actualizarHeader) window.actualizarHeader();
                    if (window.actualizarContadorAvisos) window.actualizarContadorAvisos();
                }
            }).catch(err => console.warn("Firebase read error:", err));
        });
    </script>

    <!-- ===== MÓDULO SUBE (Carga virtual) ===== -->
    <script>
        function renderSube() {
            const hoy = new Date().toISOString().split('T')[0];
            const cargasHoy = subeCargas.filter(c => c.fecha === hoy);
            const totalCargasHoy = cargasHoy.reduce((s, c) => s + c.monto, 0);
            const totalComisionesHoy = cargasHoy.reduce((s, c) => s + (c.comision || 0), 0);
            const totalGral = subeCargas.reduce((s, c) => s + c.monto + (c.comision || 0), 0);
            const totalComisionesGral = subeCargas.reduce((s, c) => s + (c.comision || 0), 0);
            const totalOperaciones = subeCargas.length;
            const metodoMap = { efectivo: 'Efectivo', transferencia: 'Transferencia', debito: 'Débito', credito: 'Crédito', otros: 'Otros' };

            const html = `
                <div class="page-header"><h2>💳 SUBE · Carga Virtual</h2><span class="badge badge-info" style="background:linear-gradient(135deg,#0099ff,#6633cc);color:#fff;border:none;">${totalOperaciones} operaciones</span></div>

                <div class="stats-grid">
                    <div class="stat-card"><span class="stat-number" style="color:#0099ff;">$${totalCargasHoy.toFixed(2)}</span><span class="stat-label">Cargas hoy</span></div>
                    <div class="stat-card"><span class="stat-number" style="color:#10b981;">+$${totalComisionesHoy.toFixed(2)}</span><span class="stat-label">Comisiones hoy</span></div>
                    <div class="stat-card"><span class="stat-number">${cargasHoy.length}</span><span class="stat-label">Operaciones hoy</span></div>
                    <div class="stat-card"><span class="stat-number" style="color:#f59e0b;">$${totalGral.toFixed(2)}</span><span class="stat-label">Total acumulado</span></div>
                    <div class="stat-card"><span class="stat-number" style="color:#10b981;">$${totalComisionesGral.toFixed(2)}</span><span class="stat-label">Comisiones totales</span></div>
                    <div class="stat-card"><span class="stat-number">${totalOperaciones}</span><span class="stat-label">Total operaciones</span></div>
                </div>

                <div class="mod-section">
                    <div class="mod-section-header"><div class="mod-icon-circle">➕</div><div><h3>Nueva carga SUBE</h3></div></div>
                    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr auto;">
                        <div class="form-group"><label>💰 Monto carga ($)</label><input id="subeMonto" class="form-input" type="number" step="0.01" min="0" value="0"></div>
                        <div class="form-group"><label>💵 Comisión ($)</label><input id="subeComision" class="form-input" type="number" step="0.01" min="0" value="0"></div>
                        <div class="form-group"><label>💳 Método pago</label><select id="subeMetodo" class="form-input"><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="otros">Otros</option></select></div>
                        <div class="form-group" style="align-self:end;"><button id="subeCargarBtn" class="btn btn-primary">➕ Cargar</button></div>
                        <div class="form-group" style="grid-column:1/-1;"><label>👤 Cliente (opcional)</label><input id="subeCliente" class="form-input" placeholder="Nombre del cliente"></div>
                    </div>
                </div>

                <div class="mod-section">
                    <div class="mod-section-header"><div class="mod-icon-circle">📋</div><div><h3>Historial</h3></div></div>
                    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
                        <input id="subeFechaFilter" class="form-input" type="date" value="${hoy}" style="width:auto;">
                        <button class="btn btn-outline" onclick="document.getElementById('subeFechaFilter').value='';renderSube();">📅 Todas</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Comisión</th><th>Total</th><th>Método</th><th></th></tr></thead>
                            <tbody>${(() => {
                                let filtro = document.getElementById('subeFechaFilter')?.value;
                                let items = filtro ? subeCargas.filter(c => c.fecha === filtro) : [...subeCargas].reverse();
                                if (!items.length) return '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Sin operaciones</td></tr>';
                                return items.slice().reverse().map(c => `
                                    <tr>
                                        <td style="font-size:0.78rem;">${new Date(c.fecha+'T00:00:00').toLocaleDateString('es',{day:'numeric',month:'short'})}</td>
                                        <td>${escapeHtml(c.cliente || '—')}</td>
                                        <td>$${c.monto.toFixed(2)}</td>
                                        <td style="color:#10b981;">+$${(c.comision||0).toFixed(2)}</td>
                                        <td><strong>$${(c.monto + (c.comision||0)).toFixed(2)}</strong></td>
                                        <td><span class="badge badge-info" style="background:var(--surface2);">${metodoMap[c.metodoPago]||c.metodoPago}</span></td>
                                        <td><button class="btn btn-sm btn-outline sube-anular-btn" data-id="${c.id}">✕</button></td>
                                    </tr>
                                `).join('');
                            })()}</tbody>
                        </table>
                    </div>
                </div>
            `;
            document.getElementById('sube').innerHTML = html;
            document.getElementById('subeCargarBtn')?.addEventListener('click', registrarCargaSube);
            document.getElementById('subeFechaFilter')?.addEventListener('change', () => renderSube());
            document.getElementById('sube')?.addEventListener('click', (e) => {
                const btn = e.target.closest('.sube-anular-btn');
                if (btn && confirm('¿Anular esta carga SUBE?')) {
                    anularCargaSube(parseInt(btn.dataset.id));
                }
            });
        }

        function registrarCargaSube() {
            const montoInput = document.getElementById('subeMonto');
            const comisionInput = document.getElementById('subeComision');
            const metodoInput = document.getElementById('subeMetodo');
            const clienteInput = document.getElementById('subeCliente');
            if (!montoInput || !comisionInput || !metodoInput) {
                toast('Error: no se encontraron los campos del formulario SUBE', true);
                return;
            }
            const monto = parseFloat(montoInput.value) || 0;
            const comision = parseFloat(comisionInput.value) || 0;
            const metodoPago = metodoInput.value || 'efectivo';
            const cliente = (clienteInput?.value || '').trim();
            if (monto <= 0) { toast('Ingresá un monto válido mayor a 0', true); return; }
            const carga = { id: Date.now(), fecha: new Date().toISOString().split('T')[0], monto, comision, metodoPago, cliente };
            subeCargas.push(carga);
            // Registrar en caja general
            if (typeof caja !== 'undefined' && caja && caja.apertura) {
                caja.movimientos.push({ fecha: new Date().toISOString(), tipo: 'ingreso', monto: monto + comision, descripcion: `Carga SUBE ($${monto} + $${comision} com.)`, metodo: metodoPago });
                if (typeof actualizarSaldoCaja === 'function') actualizarSaldoCaja();
            }
            renderSube();
            saveAll();
            const nMonto = document.getElementById('subeMonto');
            const nComision = document.getElementById('subeComision');
            const nCliente = document.getElementById('subeCliente');
            if (nMonto) { nMonto.value = '0'; setTimeout(() => nMonto.focus(), 100); }
            if (nComision) nComision.value = '0';
            if (nCliente) nCliente.value = '';
            toast('Carga realizada por $' + monto.toFixed(2) + (comision > 0 ? ' (comisión $' + comision.toFixed(2) + ')' : ''));
        }

        function anularCargaSube(id) {
            const idx = subeCargas.findIndex(c => c.id === id);
            if (idx === -1) return;
            const carga = subeCargas[idx];
            subeCargas.splice(idx, 1);
            // Reversar movimiento en caja
            if (caja.apertura) {
                caja.movimientos.push({ fecha: new Date().toISOString(), tipo: 'retiro', monto: carga.monto + (carga.comision || 0), descripcion: `Anulación carga SUBE #${id}`, metodo: carga.metodoPago });
                actualizarSaldoCaja();
            }
            saveAll();
            renderSube();
            toast('🗑️ Carga SUBE anulada');
        }
    </script>
</body>
</html>
