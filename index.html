                    <div style="display:flex; gap:14px; margin-top:18px;">
                        <button id="confirmarVentaSuelta" class="btn btn-primary">Agregar al carrito</button>
                        <button id="cancelarVentaSuelta" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const nombreInput = modal.querySelector('#sueltaNombre');
            const cantidadInput = modal.querySelector('#sueltaCantidad');
            const unidadSelect = modal.querySelector('#sueltaUnidad');
            const precioInput = modal.querySelector('#sueltaPrecio');
            const totalPreview = modal.querySelector('#sueltaTotalPreview');

            function actualizarPreview() {
                const cant = parseFloat(cantidadInput.value) || 0;
                const prec = parseFloat(precioInput.value) || 0;
                totalPreview.textContent = (cant * prec).toFixed(2);
            }
            cantidadInput.addEventListener('input', actualizarPreview);
            precioInput.addEventListener('input', actualizarPreview);
            unidadSelect.addEventListener('change', () => {
                const label = unidadSelect.value === 'kg' ? 'Precio por kg' : 'Precio unitario';
                precioInput.placeholder = label;
            });
            actualizarPreview();

            modal.querySelector('#confirmarVentaSuelta').onclick = () => {
                const nombre = nombreInput.value.trim() || 'Venta suelta';
                const cantidad = parseFloat(cantidadInput.value) || 0;
                const precio = parseFloat(precioInput.value) || 0;
                const unidad = unidadSelect.value;
                if (cantidad <= 0 || precio <= 0) { toast("Cantidad y precio deben ser mayores a cero", true); return; }
                const total = cantidad * precio;
                const id = Date.now() + 1000000;
                carrito.push({
            id: 'suelta_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            nombre: nombre,
            cantidad: cantidad,
            precioSnapshot: precio,
            costoSnapshot: 0,
            emoji: '💵',
            unidad: unidad,
            tipoVenta: 'unidad',
            esSuelta: true
                });
                renderCarrito();
                renderCarritoQuick();
                toast(`💰 "${nombre}" agregado (${cantidad} ${unidad} x $${precio} = $${total.toFixed(2)})`);
                modal.remove();
            };
            modal.querySelector('#cancelarVentaSuelta').onclick = () => modal.remove();
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        window.cambiarCantidad = (id, delta) => {
            let idx = carrito.findIndex(i => i.id == id);
            if (idx === -1) return;
            let p = productos.find(pr => pr.id == id);
            let nueva = carrito[idx].cantidad + delta;
            if (nueva <= 0) {
                const item = carrito[idx];
                registrarBorrado([item], 'Item eliminado del carrito');
                carrito.splice(idx, 1);
            } else {
                if (carrito[idx].tipoVenta === 'peso') {
                    carrito[idx].cantidad = Math.max(0.01, nueva);
                } else {
                    carrito[idx].cantidad = Math.floor(nueva);
                }
                if (p && p.stock > 0 && carrito[idx].cantidad > p.stock) toast(
                    `⚠️ Stock ${p.stock}, igual se agregará ${carrito[idx].cantidad} unidades.`, true);
            }
            renderCarrito();
            renderCarritoQuick();
        };

        function aplicarDescuento() {
            if (carrito.length === 0) { toast("Carrito vacío", true); return; }
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>Aplicar descuento</h3>
                    <select id="tipoDescuento"><option value="porcentaje">Porcentaje (%)</option><option value="monto">Monto fijo ($)</option></select>
                    <input type="number" id="valorDescuento" placeholder="Valor" step="any">
                    <div style="display:flex; gap:14px; margin-top:18px;">
                        <button id="aplicarDescBtn" class="btn btn-primary">Aplicar</button>
                        <button id="cancelDescBtn" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById("aplicarDescBtn").onclick = () => {
                let tipo = document.getElementById("tipoDescuento").value;
                let valor = parseFloat(document.getElementById("valorDescuento").value);
                if (isNaN(valor) || valor < 0) { toast("Valor inválido", true); return; }
                descuentoActivo.tipo = tipo;
                descuentoActivo.valor = valor;
                modal.remove();
                renderCarrito();
                renderCarritoQuick();
                toast("Descuento aplicado");
            };
            document.getElementById("cancelDescBtn").onclick = () => modal.remove();
        }

        function calcularTotalConDescuento(subtotal) {
            if (descuentoActivo.tipo === 'porcentaje') return subtotal * (1 - descuentoActivo.valor / 100);
            if (descuentoActivo.tipo === 'monto') return Math.max(0, subtotal - descuentoActivo.valor);
            return subtotal;
        }

        function renderCarrito() {
            let lista = document.getElementById("cartList");
            let subtotalSpan = document.getElementById("cartSubtotal");
            let totalSpan = document.getElementById("cartTotal");
            let descuentoDiv = document.getElementById("descuentoInfo");
            let itemCountSpan = document.getElementById("cartItemCount");
            if (!lista) return;
            if (carrito.length === 0) {
                lista.innerHTML = `<div style="text-align:center; padding:24px; color:var(--text-muted); font-size:1.1rem;">🛍️ Carrito vacío</div>`;
                if (subtotalSpan) subtotalSpan.innerText = "0";
                if (totalSpan) totalSpan.innerText = "0";
                if (itemCountSpan) itemCountSpan.innerText = "0 items";
                if (descuentoDiv) descuentoDiv.innerHTML = "";
                return;
            }
            let subtotal = 0,
                totalItems = 0;
            lista.innerHTML = carrito.map(item => {
                let subt = item.precioSnapshot * item.cantidad;
                subtotal += subt;
                totalItems += item.cantidad;
                let unidadDisplay = item.unidad || 'u';
                let nombreDisplay = item.esSuelta ? '💵 ' + escapeHtml(item.nombre) : escapeHtml(item.nombre);
                let precioDisplay = item.precioEspecialAplicado ? `($${item.precioEspecialAplicado} esp.)` : '';
                return `<li class="cart-item">
                    <div><strong>${nombreDisplay}</strong> $${item.precioSnapshot} ${precioDisplay} x${item.cantidad} ${unidadDisplay}</div>
                    <div class="cart-controls">
                        <button onclick="cambiarCantidad('${String(item.id).replace(/'/g,"\\'")}',-1)">-</button>
                        <span style="min-width:28px; text-align:center; font-weight:700;">${item.cantidad}</span>
                        <button onclick="cambiarCantidad('${String(item.id).replace(/'/g,"\\'")}',1)">+</button>
                        <span style="margin-left:14px; font-weight:700;">$${subt.toFixed(2)}</span>
                    </div>
                </li>`;
            }).join('');
            if (subtotalSpan) subtotalSpan.innerText = subtotal.toFixed(2);
            let total = calcularTotalConDescuento(subtotal);
            if (totalSpan) totalSpan.innerText = total.toFixed(2);
            if (itemCountSpan) itemCountSpan.innerText = `${totalItems} items`;
            if (descuentoDiv) {
                if (descuentoActivo.tipo && descuentoActivo.valor > 0)
                    descuentoDiv.innerHTML =
                    `🎉 Descuento: ${descuentoActivo.tipo==='porcentaje'?descuentoActivo.valor+'%':'$'+descuentoActivo.valor} → Total final: $${total.toFixed(2)}`;
                else descuentoDiv.innerHTML = "";
            }
        }

        // ========================================================================
        //  VENTA A CRÉDITO (FIADO)
        // ========================================================================
        async function venderACredito() {
            if (!carrito.length) { toast("Carrito vacío", true); return; }

            const subtotal = carrito.reduce((s, i) => s + i.precioSnapshot * i.cantidad, 0);
            const total = calcularTotalConDescuento(subtotal);

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:550px;">
                    <h3>📝 Venta a crédito (Fiado)</h3>
                    <p style="font-size:1.2rem; font-weight:700; text-align:center;">Total a financiar: $${total.toFixed(2)}</p>
                    <div style="margin:16px 0;">
                        <label>Seleccionar cliente existente:</label>
                        <select id="clienteSelect" style="font-size:1rem;">
                            <option value="">-- Crear nuevo cliente --</option>
                            ${clientes.map(c => `<option value="${c.id}">${escapeHtml(c.nombre)} (deuda $${c.deuda.toFixed(2)})</option>`).join('')}
                        </select>
                        <div id="nuevoClienteFields" style="margin-top:12px; display:none; border-top:1px solid var(--border); padding-top:12px;">
                            <input type="text" id="nuevoClienteNombre" placeholder="Nombre del cliente" style="font-size:1rem;">
                            <input type="text" id="nuevoClienteTelefono" placeholder="Teléfono (opcional)" style="font-size:1rem;">
                            <input type="text" id="nuevoClienteDireccion" placeholder="Dirección (opcional)" style="font-size:1rem;">
                        </div>
                    </div>
                    <div style="margin:12px 0;">
                        <label>Fecha límite de pago (opcional):</label>
                        <input type="date" id="fechaLimite" style="font-size:1rem;">
                    </div>
                    <div style="display:flex; gap:14px; margin-top:18px; flex-wrap:wrap; justify-content:center;">
                        <button id="confirmarCredito" class="btn btn-primary">✅ Confirmar crédito</button>
                        <button id="cancelarCredito" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const clienteSelect = modal.querySelector('#clienteSelect');
            const nuevoClienteFields = modal.querySelector('#nuevoClienteFields');
            const nuevoNombre = modal.querySelector('#nuevoClienteNombre');
            const nuevoTelefono = modal.querySelector('#nuevoClienteTelefono');
            const nuevoDireccion = modal.querySelector('#nuevoClienteDireccion');
            const fechaLimite = modal.querySelector('#fechaLimite');

            clienteSelect.addEventListener('change', () => {
                if (clienteSelect.value === '') {
                    nuevoClienteFields.style.display = 'block';
                } else {
                    nuevoClienteFields.style.display = 'none';
                }
            });

            modal.querySelector('#confirmarCredito').onclick = () => {
                let clienteId = Number(clienteSelect.value);
                let cliente = null;

                if (clienteSelect.value === '') {
                    const nombre = nuevoNombre.value.trim();
                    if (!nombre) { toast("El nombre del cliente es obligatorio", true); return; }
                    const telefono = nuevoTelefono.value.trim();
                    const direccion = nuevoDireccion.value.trim();
                    cliente = {
                        id: Date.now() + Math.floor(Math.random() * 1000),
                        nombre,
                        telefono,
                        direccion,
                        deuda: 0,
                        historial: []
                    };
                    clientes.push(cliente);
                    clienteId = cliente.id;
                    toast(`Cliente ${nombre} creado`);
                } else {
                    cliente = clientes.find(c => c.id === clienteId);
                    if (!cliente) { toast("Cliente no encontrado", true); return; }
                }

                let itemsVenta = [],
                    gananciaTotal = 0;
                for (let item of carrito) {
                    let p = productos.find(pr => pr.id === item.id);
                    let subt = item.precioSnapshot * item.cantidad;
                    let gan = (item.precioSnapshot - (p?.costo || 0)) * item.cantidad;
                    itemsVenta.push({
                        id: item.id,
                        nombre: item.nombre,
                        cantidad: item.cantidad,
                        precioUnitario: item.precioSnapshot,
                        subtotal: subt,
                        ganancia: gan,
                        esSuelta: item.esSuelta || false,
                        unidad: item.unidad || 'u',
                        precioEspecialAplicado: item.precioEspecialAplicado || null
                    });
                    gananciaTotal += gan;
                    if (p && !item.esSuelta) {
                        p.stock -= item.cantidad;
                        p.ventasTotales += item.cantidad;
                    }
                }

                let vendedorId = null;
                if (userMode === 'empleado' && currentEmployeeId) {
                    vendedorId = currentEmployeeId;
                }

                const nuevaVenta = {
                    id: Date.now(),
                    fecha: new Date().toISOString(),
                    total,
                    ganancia: gananciaTotal,
                    items: itemsVenta,
                    esFiado: true,
                    clienteId: clienteId,
                    vendedorId: vendedorId,
                    descuento: { ...descuentoActivo },
                    metodoPago: 'credito',
                    devuelta: false,
                    montoPagado: 0,
                    saldoPendiente: total,
                    fechaLimite: fechaLimite.value || null,
                    pagos: []
                };
                ventas.unshift(nuevaVenta);

                cliente.deuda += total;
                if (!cliente.historial) cliente.historial = [];
                cliente.historial.push({
                    tipo: 'venta',
                    fecha: nuevaVenta.fecha,
                    monto: total,
                    ventaId: nuevaVenta.id,
                    descripcion: `Venta a crédito #${nuevaVenta.id}`
                });

                if (turnoActivo) { turnoActivo.ventasIds.push(nuevaVenta.id);
                    turnoActivo.totalVendido += total; }

                if (caja.apertura) {
                    caja.movimientos.push({
                        fecha: new Date().toISOString(),
                        tipo: "ingreso",
                        monto: total,
                        descripcion: `Venta a crédito (${cliente.nombre})`,
                        metodo: 'credito'
                    });
                    actualizarSaldoCaja();
                }
                caja._version = Date.now() + Math.random();
                saveAll();
                carrito.length = 0;
                descuentoActivo.tipo = null; descuentoActivo.valor = 0;
                renderCarrito();
                renderCarritoQuick();
                if (document.getElementById("ventas").classList.contains("active")) {
                    renderProductos(document.getElementById("buscadorInput")?.value || "");
                    renderQuickButtons();
                }
                if (document.getElementById("rapido").classList.contains("active")) { renderModoRapido(); }
                actualizarHeader();
                playSound();

                if (config.mostrarTicket !== false) {
                    imprimirTicket(nuevaVenta);
                }

                toast(`📝 Crédito registrado: $${total.toFixed(2)} a ${cliente.nombre}`);
                modal.remove();
                if (document.getElementById("fiado").classList.contains("active")) renderFiado();
            };

            modal.querySelector('#cancelarCredito').onclick = () => modal.remove();
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // ========================================================================
        //  PAGO MIXTO CON VUELTO (CONTADO) - VERSIÓN MEJORADA CON SEPARACIÓN DE CIGARRILLOS
        // ========================================================================
        async function continuarPago() {
            for (let item of carrito) {
                if (item.esSuelta) continue;
                let prod = productos.find(p => p.id === item.id);
                if (prod && prod.stock < item.cantidad) toast(
                    `⚠️ Stock insuficiente de ${prod.nombre} (tiene ${prod.stock}, pide ${item.cantidad}). Se venderá igual.`,
                    true);
            }
            const subtotal = carrito.reduce((s, i) => s + i.precioSnapshot * i.cantidad, 0);
            const total = calcularTotalConDescuento(subtotal);

            // 🔥 DETECTAR CIGARRILLOS
            let totalCigarrillos = 0;
            let itemsCigarrillos = [];
            let itemsNoCigarrillos = [];

            for (let item of carrito) {
                let prod = productos.find(p => p.id === item.id);
                let esCigarrillo = prod && esProductoCigarrillo(prod);
                if (esCigarrillo) {
                    totalCigarrillos += item.precioSnapshot * item.cantidad;
                    itemsCigarrillos.push(item);
                } else {
                    itemsNoCigarrillos.push(item);
                }
            }

            const totalResto = total - totalCigarrillos;

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:550px;">
                    <h3>💳 Pago Mixto</h3>
                    <p style="font-size:1.2rem; font-weight:700; text-align:center;">Total a pagar: $${total.toFixed(2)}</p>
                    ${totalCigarrillos > 0 ? `
                        <div style="background:var(--surface2); padding:10px; border-radius:12px; margin:10px 0;">
                            <div style="display:flex; justify-content:space-between; font-weight:600;">
                                <span>🚬 Cigarrillos</span>
                                <span>$${totalCigarrillos.toFixed(2)}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-weight:600;">
                                <span>🛒 Resto</span>
                                <span>$${totalResto.toFixed(2)}</span>
                            </div>
                            <hr style="margin:6px 0;">
                            <div style="display:flex; justify-content:space-between; font-weight:700;">
                                <span>Total</span>
                                <span>$${total.toFixed(2)}</span>
                            </div>
                        </div>
                    ` : ''}
                    <div style="margin:16px 0; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div><label>💰 Efectivo</label><input type="number" id="pagoEfectivo" placeholder="0.00" step="0.01" min="0" value="0"></div>
                        <div><label>💳 Transferencia</label><input type="number" id="pagoTransferencia" placeholder="0.00" step="0.01" min="0" value="0"><br><label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;margin-top:2px;"><input type="checkbox" id="transfPendiente"> ⏳ Aún no transfirió (pendiente)</label></div>
                        <div><label>💳 Tarjeta</label><input type="number" id="pagoTarjeta" placeholder="0.00" step="0.01" min="0" value="0"></div>
                        <div><label>📱 QR</label><input type="number" id="pagoQR" placeholder="0.00" step="0.01" min="0" value="0"></div>
                    </div>
                    <div style="text-align:center; font-size:1.1rem; font-weight:700;">
                        Faltante: <span id="faltantePago" style="color:var(--danger);">$${total.toFixed(2)}</span>
                    </div>
                    <div style="text-align:center; font-size:1.2rem; font-weight:700; margin-top:8px; color:var(--success);">
                        💸 Vuelto en efectivo: <span id="vueltoCalculado">$0.00</span>
                    </div>
                    <div style="display:flex; gap:14px; margin-top:18px; flex-wrap:wrap; justify-content:center;">
                        <button id="confirmarPagoMixto" class="btn btn-primary">✅ Confirmar</button>
                        <button id="cancelarPagoMixto" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const inputs = {
                efectivo: modal.querySelector('#pagoEfectivo'),
                transferencia: modal.querySelector('#pagoTransferencia'),
                tarjeta: modal.querySelector('#pagoTarjeta'),
                qr: modal.querySelector('#pagoQR')
            };
            const faltanteSpan = modal.querySelector('#faltantePago');
            const vueltoSpan = modal.querySelector('#vueltoCalculado');

            function actualizarFaltanteYVuelto() {
                let sum = 0;
                for (let key in inputs) {
                    sum += parseFloat(inputs[key].value) || 0;
                }
                const faltante = Math.max(0, total - sum);
                faltanteSpan.textContent = `$${faltante.toFixed(2)}`;
                if (faltante <= 0) {
                    faltanteSpan.style.color = 'var(--success)';
                } else {
                    faltanteSpan.style.color = 'var(--danger)';
                }

                const ef = parseFloat(inputs.efectivo.value) || 0;
                const pendienteCheck = document.getElementById('transfPendiente');
                const esPendiente = pendienteCheck ? pendienteCheck.checked : false;
                const transferReal = esPendiente ? 0 : (parseFloat(inputs.transferencia.value) || 0);
                const otros = transferReal +
                              (parseFloat(inputs.tarjeta.value) || 0) +
                              (parseFloat(inputs.qr.value) || 0);
                const totalPagado = ef + otros;
                let vuelto = 0;
                if (totalPagado >= total && ef > (total - otros)) {
                    vuelto = ef - (total - otros);
                    if (vuelto < 0) vuelto = 0;
                }
                vueltoSpan.textContent = `$${vuelto.toFixed(2)}`;
                if (vuelto > 0) {
                    vueltoSpan.style.color = 'var(--success)';
                } else {
                    vueltoSpan.style.color = 'var(--text-muted)';
                }
            }

            for (let key in inputs) {
                inputs[key].addEventListener('input', actualizarFaltanteYVuelto);
            }
            actualizarFaltanteYVuelto();

            modal.querySelector('#confirmarPagoMixto').onclick = () => {
                let montos = {};
                let totalPagado = 0;
                for (let key in inputs) {
                    let val = parseFloat(inputs[key].value) || 0;
                    montos[key] = val;
                    totalPagado += val;
                }
                if (totalPagado < total) {
                    toast("El monto total no cubre la venta", true);
                    return;
                }

                const pendienteCheck = modal.querySelector('#transfPendiente');
                const esPendiente = pendienteCheck ? pendienteCheck.checked : false;
                const transferReal = esPendiente ? 0 : (montos.transferencia || 0);
                const ef = montos.efectivo || 0;
                const otros = transferReal + (montos.tarjeta || 0) + (montos.qr || 0);
                const totalRecibido = ef + otros;
                let vuelto = 0;
                if (totalRecibido >= total && ef > (total - otros)) {
                    vuelto = ef - (total - otros);
                    if (vuelto < 0) vuelto = 0;
                }

                let movimientos = [];
                if (ef > 0) {
                    movimientos.push({ metodo: 'efectivo', monto: ef });
                }
                if (montos.transferencia > 0 && !esPendiente) movimientos.push({ metodo: 'transferencia', monto: montos.transferencia });
                if (montos.tarjeta > 0) movimientos.push({ metodo: 'tarjeta', monto: montos.tarjeta });
                if (montos.qr > 0) movimientos.push({ metodo: 'qr', monto: montos.qr });

                modal.remove();

                if (esPendiente && montos.transferencia > 0) {
                    const itemsSnapshot = JSON.parse(JSON.stringify(carrito));
                    const modal2 = document.createElement('div');
                    modal2.className = 'modal-overlay';
                    modal2.innerHTML = `
                        <div class="modal-card" style="max-width:400px;">
                            <h3>⏳ Transferencia Pendiente</h3>
                            <p>¿Nombre del cliente que debe la transferencia de <strong>$${montos.transferencia.toFixed(2)}</strong>?</p>
                            <input type="text" id="nombreClientePendiente" placeholder="Nombre del cliente" autocomplete="off" style="width:100%;margin:10px 0;">
                            <div style="display:flex; gap:10px; justify-content:flex-end;">
                                <button id="cancelarPendiente" class="btn btn-outline">Omitir</button>
                                <button id="confirmarPendiente" class="btn btn-primary">Guardar</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal2);
                    const input = modal2.querySelector('#nombreClientePendiente');
                    input.focus();
                    const guardarPendiente = () => {
                        const nombre = input.value.trim() || "Sin nombre";
                        transferenciasPendientes.push({
                            id: Date.now(),
                            monto: montos.transferencia,
                            totalVenta: total,
                            cliente: nombre,
                            fecha: new Date().toISOString(),
                            pagada: false,
                            items: itemsSnapshot
                        });
                        saveAll();
                        modal2.remove();
                        finalizarVentaMixta(total, movimientos, vuelto, totalCigarrillos);
                        toast("⏳ Transferencia pendiente registrada");
                    };
                    const omitirPendiente = () => {
                        modal2.remove();
                        finalizarVentaMixta(total, movimientos, vuelto, totalCigarrillos);
                        toast("Transferencia pendiente omitida");
                    };
                    modal2.querySelector('#confirmarPendiente').onclick = guardarPendiente;
                    modal2.querySelector('#cancelarPendiente').onclick = omitirPendiente;
                    input.addEventListener('keydown', e => { if (e.key === 'Enter') guardarPendiente(); });
                    modal2.addEventListener('click', e => { if (e.target === modal2) omitirPendiente(); });
                    return;
                }

                finalizarVentaMixta(total, movimientos, vuelto, totalCigarrillos);
            };

        async function finalizarVentaMixta(total, movimientos, vuelto = 0, totalCigarrillos = 0) {
            for (let item of carrito) {
                if (item.esSuelta) continue;
                let prod = productos.find(p => p.id === item.id);
                if (prod) {
                    prod.stock -= item.cantidad;
                    prod.ventasTotales += item.cantidad;
                    // Cigarette stock deduction (atados/cartones)
                    if (esItemCigarrillo(item)) {
                        let atadosADeducir = item.cantidad;
                        if (prod.stockAtados !== undefined) {
                            let deAtados = Math.min(atadosADeducir, prod.stockAtados);
                            prod.stockAtados -= deAtados;
                            atadosADeducir -= deAtados;
                            if (atadosADeducir > 0 && prod.stockCartones > 0) {
                                const apc = prod.atadosPorCarton || getCigConfig().atadosPorCarton;
                                let cartNeeded = Math.ceil(atadosADeducir / apc);
                                cartNeeded = Math.min(cartNeeded, prod.stockCartones);
                                prod.stockCartones -= cartNeeded;
                                prod.stockAtados += (cartNeeded * apc) - atadosADeducir;
                                atadosADeducir = 0;
                            }
                        }
                        cigMovimientosStock.push({
                            fecha: new Date().toISOString(),
                            productoId: prod.id,
                            productoNombre: prod.nombre,
                            tipo: 'venta',
                            cartones: 0,
                            atados: -(item.cantidad),
                            descripcion: 'Venta #' + Date.now()
                        });
                    }
                }
            }

            let itemsVenta = [],
                gananciaTotal = 0;
            for (let item of carrito) {
                let p = productos.find(pr => pr.id === item.id);
                let subt = item.precioSnapshot * item.cantidad;
                let gan = (item.precioSnapshot - (p?.costo || 0)) * item.cantidad;
                itemsVenta.push({
                    id: item.id,
                    nombre: item.nombre,
                    cantidad: item.cantidad,
                    precioUnitario: item.precioSnapshot,
                    subtotal: subt,
                    ganancia: gan,
                    esSuelta: item.esSuelta || false,
                    unidad: item.unidad || 'u',
                    precioEspecialAplicado: item.precioEspecialAplicado || null
                });
                gananciaTotal += gan;
            }

            let vendedorId = null;
            if (userMode === 'empleado' && currentEmployeeId) {
                vendedorId = currentEmployeeId;
            }

            let descMetodos = movimientos.map(m => `${m.metodo}: $${m.monto.toFixed(2)}`).join(' + ');
            let metodoPago = 'mixto';

            let nuevaVenta = {
                id: Date.now(),
                fecha: new Date().toISOString(),
                total,
                ganancia: gananciaTotal,
                items: itemsVenta,
                esFiado: false,
                clienteId: null,
                vendedorId: vendedorId,
                descuento: { ...descuentoActivo },
                metodoPago: metodoPago,
                devuelta: false,
                montoPagado: movimientos.reduce((s, m) => s + m.monto, 0),
                pagoMixto: movimientos,
                vuelto: vuelto,
                // 🔥 Guardamos el desglose de cigarrillos
                desglose: {
                    cigarrillos: totalCigarrillos,
                    resto: total - totalCigarrillos
                }
            };
            ventas.unshift(nuevaVenta);

            if (turnoActivo) { turnoActivo.ventasIds.push(nuevaVenta.id);
                turnoActivo.totalVendido += total; }

            if (caja.apertura) {
                // Si hay cigarrillos, registramos movimientos separados
                if (totalCigarrillos > 0) {
                    // Distribuir proporcionalmente los pagos entre cigarrillos y resto
                    for (let m of movimientos) {
                        // Calcular monto cigarrillos con redondeo; resto = diferencia exacta
                        let montoCigarrillos = Math.round(m.monto * (totalCigarrillos / total) * 100) / 100;
                        let montoResto = Math.round((m.monto - montoCigarrillos) * 100) / 100;
                        // Ajustar el primer movimiento para absorber diferencias de redondeo acumuladas
                        if (m === movimientos[0]) {
                            let sumaCig = movimientos.reduce((acc, cur) => {
                                if (cur === m) return acc + montoCigarrillos;
                                return acc + Math.round(cur.monto * (totalCigarrillos / total) * 100) / 100;
                            }, 0);
                            montoCigarrillos += Math.round((totalCigarrillos - sumaCig) * 100) / 100;
                            montoResto = Math.round((m.monto - montoCigarrillos) * 100) / 100;
                        }
                        if (montoCigarrillos > 0.001) {
                            caja.movimientos.push({
                                fecha: new Date().toISOString(),
                                tipo: "ingreso",
                                monto: montoCigarrillos,
                                descripcion: `Venta cigarrillos (${m.metodo})`,
                                metodo: m.metodo
                            });
                            // También registrar en caja de cigarrillos si está abierta
                            if (cigCaja && cigCaja.apertura) {
                                cigCaja.movimientos.push({
                                    fecha: new Date().toISOString(),
                                    tipo: "ingreso",
                                    monto: montoCigarrillos,
                                    descripcion: `Venta cigarrillos (${m.metodo})`,
                                    metodo: m.metodo
                                });
                                actualizarCigCajaSaldo();
                            }
                        }
                        if (montoResto > 0.001) {
                            caja.movimientos.push({
                                fecha: new Date().toISOString(),
                                tipo: "ingreso",
                                monto: montoResto,
                                descripcion: `Venta general (${m.metodo})`,
                                metodo: m.metodo
                            });
                        }
                    }
                } else {
                    // Sin cigarrillos, registro normal
                    for (let m of movimientos) {
                        caja.movimientos.push({
                            fecha: new Date().toISOString(),
                            tipo: "ingreso",
                            monto: m.monto,
                            descripcion: `Venta mixto (${m.metodo})`,
                            metodo: m.metodo
                        });
                    }
                }
                if (vuelto > 0) {
                    caja.movimientos.push({
                        fecha: new Date().toISOString(),
                        tipo: "retiro",
                        monto: vuelto,
                        descripcion: `Vuelto`,
                        metodo: 'efectivo'
                    });
                }
                actualizarSaldoCaja();
            }

            caja._version = Date.now() + Math.random();
            saveAll();
            carrito.length = 0;
            descuentoActivo.tipo = null; descuentoActivo.valor = 0;
            renderCarrito();
            renderCarritoQuick();
            if (document.getElementById("ventas").classList.contains("active")) {
                renderProductos(document.getElementById("buscadorInput")?.value || "");
                renderQuickButtons();
            }
            if (document.getElementById("rapido").classList.contains("active")) { renderModoRapido(); }
            actualizarHeader();
            playSound();

            if (config.mostrarTicket !== false) {
                imprimirTicket(nuevaVenta);
            }

            let msgVuelto = vuelto > 0 ? ` | 💸 Vuelto: $${vuelto.toFixed(2)}` : '';
            let msgCigarrillos = totalCigarrillos > 0 ? ` (🚬 Cigarrillos: $${totalCigarrillos.toFixed(2)})` : '';
            toast(`Venta $${total.toFixed(2)} | Pago: ${descMetodos}${msgVuelto}${msgCigarrillos}`);
        }

        function abrirCalculadora() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width: 380px;">
                    <h3>🧮 Calculadora rápida</h3>
                    <div class="calc-display" id="calcDisplay">0</div>
                    <div class="calc-grid">
                        <button class="calc-clear" data-action="clear">C</button>
                        <button data-action="back">⌫</button>
                        <button data-action="percent">%</button>
                        <button class="calc-op" data-action="divide">÷</button>
                        <button data-action="7">7</button>
                        <button data-action="8">8</button>
                        <button data-action="9">9</button>
                        <button class="calc-op" data-action="multiply">×</button>
                        <button data-action="4">4</button>
                        <button data-action="5">5</button>
                        <button data-action="6">6</button>
                        <button class="calc-op" data-action="subtract">−</button>
                        <button data-action="1">1</button>
                        <button data-action="2">2</button>
                        <button data-action="3">3</button>
                        <button class="calc-op" data-action="add">+</button>
                        <button data-action="0">0</button>
                        <button data-action="dot">.</button>
                        <button class="calc-eq" data-action="equals">=</button>
                        <button class="calc-eq" style="background:var(--success);" data-action="insert">💰 Insertar total</button>
                    </div>
                    <div style="margin-top:14px; display:flex; gap:10px; justify-content:flex-end;">
                        <button id="calcCloseBtn" class="btn btn-outline">Cerrar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            const display = document.getElementById('calcDisplay');
            let expression = "";

            const updateDisplay = () => { display.textContent = expression || "0"; };

            modal.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const action = btn.dataset.action;
                if (action === 'clear') { expression = "";
                    updateDisplay(); return; }
                if (action === 'back') { expression = expression.slice(0, -1);
                    updateDisplay(); return; }
                if (action === 'insert') {
                    const total = document.getElementById('cartTotal')?.textContent || "0";
                    const parsed = parseFloat(total);
                    if (!isNaN(parsed)) { expression = parsed.toString();
                        updateDisplay();
                        toast("Total del carrito insertado"); } else toast("No hay total", true);
                    return;
                }
                if (action === 'equals') {
                    try {
                        const result = Function('"use strict"; return (' + expression.replace(/×/g, '*').replace(/÷/g,
                                '/').replace(/−/g, '-') + ')')();
                        if (!isNaN(result) && isFinite(result)) {
                            expression = String(parseFloat(result.toFixed(6)));
                            updateDisplay();
                        } else { toast("Error", true); }
                    } catch (e) { toast("Error", true); }
                    return;
                }
                const ops = ['add', 'subtract', 'multiply', 'divide', 'percent'];
                if (ops.includes(action)) {
                    const opMap = { add: '+', subtract: '−', multiply: '×', divide: '÷', percent: '%' };
                    expression += opMap[action];
                    updateDisplay();
                    return;
                }
                expression += btn.textContent;
                updateDisplay();
            });

            document.getElementById('calcCloseBtn').onclick = () => modal.remove();
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

                    p.nombre.toLowerCase().includes(txtLC) ||

                    (p.alias && p.alias.toLowerCase().includes(txtLC)) ||

                if (isNaN(precioActual) || precioActual <= 0) {
                    rapidNuevoPrecio.textContent = '';
                    return;
                }
                const porcentajeStr = rapidPorcentaje.value.trim();
                if (!porcentajeStr) {
                    rapidNuevoPrecio.textContent = '';
                    return;
                }
                let signo = 1;
                let numStr = porcentajeStr;
                if (porcentajeStr.startsWith('+')) {
                    signo = 1;
                    numStr = porcentajeStr.substring(1);
                } else if (porcentajeStr.startsWith('-')) {
                    signo = -1;
                    numStr = porcentajeStr.substring(1);
                }
                const porcentaje = parseFloat(numStr);
                if (isNaN(porcentaje)) {
                    rapidNuevoPrecio.textContent = '';
                    return;
                }
                const nuevoPrecio = precioActual * (1 + (signo * porcentaje / 100));
                if (nuevoPrecio < 0) {
                    rapidNuevoPrecio.textContent = '⚠️ Precio negativo';
                    rapidNuevoPrecio.style.color = 'var(--danger)';
                } else {

            function procesarExcel(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet);
                        if (!rows.length) { toast("El Excel está vacío", true); return; }

                        const headers = Object.keys(rows[0]);
                        function findColumn(matches) {
                            for (let h of headers) {
                                const hLower = h.toLowerCase().trim();
                                for (let m of matches) {
                                    if (hLower === m.toLowerCase().trim()) return h;
                                }
                            }
                            return null;
                        }
                        const colNombre = findColumn(['concepto', 'nombre', 'producto']);
                        const colPrecio = findColumn(['precio venta', 'precio', 'precioventa']);
                        const colStock = findColumn(['stock']);
                        const colCodigo = findColumn(['codigo', 'código']);
                        const colCosto = findColumn(['costo']);
                        const colCategoria = findColumn(['familia', 'categoría', 'categoria']);
                        const colProveedor = findColumn(['proveedor']);
                        const colTipoVenta = findColumn(['tipo_venta', 'tipoventa', 'tipo']);
                        const colPrecioKg = findColumn(['precio_kg', 'preciokg', 'preciokilo']);
                        const colPrecioEspecial = findColumn(['precio_especial', 'precioesp']);
                        const colHoraInicio = findColumn(['hora_inicio', 'horainicio']);
                        const colHoraFin = findColumn(['hora_fin', 'horafin']);
                        const colMarca = findColumn(['marca']);
                        const colDescripcion = findColumn(['descripcion', 'descripción']);
                        const colPeso = findColumn(['peso']);
                        const colPresentacion = findColumn(['presentacion', 'presentación']);
                        const colContenido = findColumn(['contenido']);
                        const colAlias = findColumn(['alias']);
                        const colSinonimos = findColumn(['sinonimos', 'sinónimos']);

                        if (!colNombre || !colPrecio || !colStock) {
                            toast("El Excel debe tener columnas: CONCEPTO, PRECIO VENTA, STOCK (al menos)", true);
                            return;
                        }

                        let agregados = 0;
                        for (let row of rows) {
                            const nombre = String(row[colNombre] || '').trim();
                            const precio = parseFloat(row[colPrecio]) || 0;
                            const stock = parseInt(row[colStock]) || 0;
                            const codigo = String(row[colCodigo] || '').trim();
                            const costo = parseFloat(row[colCosto]) || 0;
                            const catNombre = String(row[colCategoria] || '').trim();
                            const provNombre = String(row[colProveedor] || '').trim();
                            let tipoVenta = 'unidad';
                            if (colTipoVenta) {
                                const tv = String(row[colTipoVenta] || '').trim().toLowerCase();
                                if (tv === 'peso') tipoVenta = 'peso';
                            }
                            let precioKg = null;
                            if (colPrecioKg) {
                                precioKg = parseFloat(row[colPrecioKg]) || null;
                            }
                            let precioEspecial = null;
                            if (colPrecioEspecial) {
                                const pe = parseFloat(row[colPrecioEspecial]);
                                if (!isNaN(pe) && pe > 0) precioEspecial = pe;
                            }
                            let horaInicio = null;
                            if (colHoraInicio) {
                                const hi = String(row[colHoraInicio] || '').trim();
                                if (hi) horaInicio = hi;
                            }
                            let horaFin = null;
                            if (colHoraFin) {
                                const hf = String(row[colHoraFin] || '').trim();
                                if (hf) horaFin = hf;
                            }

                            let marca = colMarca ? String(row[colMarca] || '').trim() : '';
                            let descripcion = colDescripcion ? String(row[colDescripcion] || '').trim() : '';
                            let peso = colPeso ? String(row[colPeso] || '').trim() : '';
                            let presentacion = colPresentacion ? String(row[colPresentacion] || '').trim() : '';
                            let contenido = colContenido ? String(row[colContenido] || '').trim() : '';
                            let alias = colAlias ? String(row[colAlias] || '').trim() : '';
                            let sinonimos = colSinonimos ? String(row[colSinonimos] || '').trim() : '';

                            if (!nombre || isNaN(precio) || precio <= 0) continue;

                            let categoriaId = null;
                            if (catNombre) {
                                let cat = categorias.find(c => c.nombre.toLowerCase() === catNombre.toLowerCase());
                                if (!cat) {
                                    cat = { id: Date.now() + Math.floor(Math.random() * 10000), nombre: catNombre };
                                    categorias.push(cat);
                                }
                                categoriaId = cat.id;
                            }
                            if (!categoriaId && categorias.length) categoriaId = categorias[0].id;

                            let proveedorId = null;
                            if (provNombre) {
                                let prov = proveedores.find(p => p.nombre.toLowerCase() === provNombre.toLowerCase());
                                if (!prov) {
                                    prov = { id: Date.now() + Math.floor(Math.random() * 10000), nombre: provNombre, contacto: '',
                                        telefono: '', productosIds: [], deuda: 0, pedidos: [] };
                                    proveedores.push(prov);
                                }
                                proveedorId = prov.id;
                            }

                            let existing = productos.find(p => p.codigo === codigo && codigo !== '');
                            if (existing) {
                                existing.nombre = nombre;
                                existing.precio = precio;
                                existing.stock = stock;
                                existing.costo = costo;
                                existing.categoriaId = categoriaId;
                                existing.proveedorId = proveedorId;
                                existing.tipoVenta = tipoVenta;
                                existing.precioPorKilo = precioKg;
                                existing.precioEspecial = precioEspecial;
                                existing.horaInicioEspecial = horaInicio;
                                existing.horaFinEspecial = horaFin;
                                existing.marca = marca;
                                existing.descripcion = descripcion;
                                existing.peso = peso;
                                existing.presentacion = presentacion;
                                existing.contenido = contenido;
                                existing.alias = alias;
                                existing.sinonimos = sinonimos;
                            } else {
                                productos.push({
                                    id: Date.now() + Math.floor(Math.random() * 10000),
                                    nombre,
                                    precio,
                                    stock,
                                    emoji: '📦',
                                    costo,
                                    proveedorId,
                                    categoriaId,
                                    codigo: codigo || '',
                                    ventasTotales: 0,
                                    vencimiento: null,
                                    tipoVenta,
                                    precioPorKilo: precioKg,
                                    precioEspecial: precioEspecial,
                                    horaInicioEspecial: horaInicio,
                                    horaFinEspecial: horaFin,
                                    marca, descripcion, imagen: '', peso, presentacion, contenido, alias, sinonimos
                                });
                            }
                            agregados++;
                        }
                        saveAll();
                        renderTablaConFiltro();
                        if (document.getElementById("ventas").classList.contains("active")) renderVentas();
                        toast(`✅ ${agregados} productos procesados desde Excel`);
                    } catch (err) {
                        toast("Error al leer el Excel: " + err.message, true);
                        console.error(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function exportarProductosExcel() {
                if (!productos.length) { toast("No hay productos para exportar", true); return; }
                const data = productos.map(p => ({
                    'CODIGO': p.codigo || '',
                    'CONCEPTO': p.nombre,
                    'COSTO': p.costo || 0,
                    'PRECIO VENTA': p.precio,
                    'STOCK': p.stock,
                    'FAMILIA': categorias.find(c => c.id === p.categoriaId)?.nombre || '',
                    'PROVEEDOR': proveedores.find(pr => pr.id === p.proveedorId)?.nombre || '',
                    'TIPO_VENTA': p.tipoVenta || 'unidad',
                    'PRECIO_KG': p.precioPorKilo || '',
                    'PRECIO_ESPECIAL': p.precioEspecial || '',
                    'HORA_INICIO': p.horaInicioEspecial || '',
                    'HORA_FIN': p.horaFinEspecial || ''
                }));
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "Productos");
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `productos_${new Date().toISOString().slice(0,10)}.xlsx`;
                link.click();
                URL.revokeObjectURL(link.href);
                toast("✅ Productos exportados a Excel");
            }

            document.getElementById("exportExcelBtn").addEventListener("click", exportarProductosExcel);

            document.getElementById("borrarTodosBtn").addEventListener("click", async function() {
                if (!await ensureAdmin()) return;
                if (!confirm("⚠️ ¿Estás seguro de que querés borrar TODOS los productos?\nEsta acción no se puede deshacer.")) {
                    return;
                }
                const texto = prompt("Confirmá escribiendo 'BORRAR' en el cuadro de texto y presionando Aceptar, o Cancelá para abortar.");
                if (texto !== "BORRAR") {
                    toast("Operación cancelada", false);
                    return;
                }
                productos = [];
                carrito.length = 0;
                saveAll();
                renderTablaConFiltro();
                if (document.getElementById("ventas").classList.contains("active")) {
                    renderVentas();
                }
                if (document.getElementById("rapido").classList.contains("active")) {
                    renderModoRapido();
                }
                toast("✅ Todos los productos han sido eliminados permanentemente.");
            });

            const renderTablaConFiltro = () => {
                const raw = document.getElementById("adminSearchInput")?.value || "";
                const searchTerm = raw ? normalizarAcentos(raw) : "";
                let filtered = productos.filter(p => {
                    if (!searchTerm) return true;
                    return normalizarAcentos(p.nombre).includes(searchTerm) || (p.codigo && normalizarAcentos(p.codigo).includes(searchTerm)) || (p.marca && normalizarAcentos(p.marca).includes(searchTerm)) || (p.alias && normalizarAcentos(p.alias).includes(searchTerm)) || (p.sinonimos && normalizarAcentos(p.sinonimos).includes(searchTerm));
                });
                let tbody = document.getElementById("adminTableBody");
                if (!tbody) return;
                tbody.innerHTML = filtered.map(p => {
                    let catNombre = categorias.find(c => c.id == p.categoriaId)?.nombre || '-';
                    let precioDisplay = p.tipoVenta === 'peso' ? `$${p.precioPorKilo || p.precio}/kg` :
                        `$${p.precio}`;
                    return `<tr>
                        <td>${escapeHtml(p.emoji||'📦')}</td>
                        <td>${escapeHtml(p.nombre)}</td>
                        <td>${escapeHtml(p.marca||'-')}</td>
                        <td>${precioDisplay}</td>
                        <td>${p.tipoVenta}</td>
                        <td>${p.precioPorKilo ? '$'+p.precioPorKilo : '-'}</td>
                        <td>${p.precioEspecial ? '$'+p.precioEspecial : '-'}</td>
                        <td>${p.stock}</td>
                        <td>${escapeHtml(catNombre)}</td>
                        <td>${escapeHtml(p.codigo||'-')}</td>

                            <button class="btn btn-outline" onclick="editarProductoModal(${p.id})" title="Editar">✏️</button>
                            ${!p.codigo ? `<button class="btn btn-outline" onclick="generarCodigoParaProducto(${p.id})" title="Generar código EAN-13" style="border-color:#10b981;color:#10b981;">🔳</button>` : ''}
                            <button class="btn btn-outline" onclick="eliminarProducto(${p.id})" title="Eliminar">❌</button>
                        </td>

                document.body.appendChild(modal);

                document.getElementById("calcEditPrecioBtn").addEventListener("click", () => {
                    const costo = parseFloat(document.getElementById("editCosto").value);
                    const margen = parseFloat(document.getElementById("editMargen").value);
                    if (isNaN(costo) || costo <= 0) { toast("Costo válido", true); return; }
                    if (isNaN(margen) || margen < 0) { toast("Porcentaje válido", true); return; }
                    const precioCalc = calcularPrecioDesdeMargen(costo, margen);

                    document.getElementById("editPrecio").value = precioCalc.toFixed(2);

                document.getElementById("guardarEditBtn").onclick = () => {
                    p.nombre = document.getElementById("editNombre").value.trim();

                    const precioEspecial = parseFloat(document.getElementById("editPrecioEspecial").value);

                    p.horaInicioEspecial = document.getElementById("editHoraInicio").value || null;
                    p.horaFinEspecial = document.getElementById("editHoraFin").value || null;
                    p.categoriaId = parseInt(document.getElementById("editCategoria").value);
                    p.proveedorId = parseInt(document.getElementById("editProveedor").value) || null;
                    p.marca = document.getElementById("editMarca").value.trim();
                    p.descripcion = document.getElementById("editDescripcion").value.trim();
                    p.imagen = document.getElementById("editImagen").value.trim();
                    p.peso = document.getElementById("editPeso").value.trim();

                    p.contenido = document.getElementById("editContenido").value.trim();
                    p.alias = document.getElementById("editAlias").value.trim();
                    p.sinonimos = document.getElementById("editSinonimos").value.trim();
                    p.esCigarrillo = document.getElementById("editEsCigarrillo").checked;
                    if (isNaN(p.precio) || isNaN(p.stock)) { toast("Precio y stock deben ser números", true); return; }
                    saveAll();
                    renderTablaConFiltro();
                    if (document.getElementById("ventas").classList.contains("active")) renderVentas();
                    toast("Producto actualizado");
                    modal.remove();
                };
                document.getElementById("cancelEditBtn").onclick = () => modal.remove();
            };

            window.eliminarProducto = (id) => {
                if (confirm("¿Eliminar producto?")) {
                    const idx = carrito.findIndex(i => i.id === id);
                    if (idx >= 0) carrito.splice(idx, 1);
                    productos = productos.filter(p => p.id !== id);
                    saveAll();
                    renderTablaConFiltro();
                    if (document.getElementById("ventas").classList.contains("active")) renderVentas();
                    toast("Producto eliminado");
                }
            };

            document.getElementById("calcPrecioBtn").addEventListener("click", () => {
                const costo = parseFloat(document.getElementById("prodCosto").value);
                const margen = parseFloat(document.getElementById("prodMargen").value);
                if (isNaN(costo) || costo <= 0) { toast("Ingrese costo válido", true); return; }
                if (isNaN(margen) || margen < 0) { toast("Porcentaje válido", true); return; }
                const precioCalc = calcularPrecioDesdeMargen(costo, margen);
                if (precioCalc === null) { toast("Error al calcular precio", true); return; }
                document.getElementById("prodPrecio").value = precioCalc.toFixed(2);
                toast(`✅ Precio: $${precioCalc.toFixed(2)}`);
            });

            document.getElementById("guardarProdBtn").onclick = () => {
                let nombre = document.getElementById("prodNombre").value.trim();
                let precio = parseFloat(document.getElementById("prodPrecio").value);
                let costo = parseFloat(document.getElementById("prodCosto").value) || 0;
                let stock = parseInt(document.getElementById("prodStock").value) || 0;
                let emoji = document.getElementById("prodEmoji").value.trim() || "📦";
                let codigo = document.getElementById("prodCodigo").value.trim();
                let provId = parseInt(document.getElementById("prodProv").value) || null;
                let catId = parseInt(document.getElementById("prodCategoria").value) || (categorias.length ? categorias[0]
                    .id : null);
                let tipoVenta = document.getElementById("prodTipoVenta").value;
                let precioKg = parseFloat(document.getElementById("prodPrecioPorKilo").value);
                let precioEspecial = parseFloat(document.getElementById("prodPrecioEspecial").value);
                let horaInicio = document.getElementById("prodHoraInicio").value || null;
                let horaFin = document.getElementById("prodHoraFin").value || null;
                let editId = document.getElementById("editProdId").value;
                if (!nombre || isNaN(precio) || isNaN(stock)) { toast("Complete campos", true); return; }
                if (tipoVenta === 'peso' && (isNaN(precioKg) || precioKg <= 0)) {
                    toast("Para venta por peso, ingresa el precio por kilo", true);
                    return;
                }
                if (precioEspecial && precioEspecial > 0 && (!horaInicio || !horaFin)) {
                    toast("Para usar precio especial, debes definir hora inicio y fin", true);
                    return;
                }
                let marca = document.getElementById("prodMarca").value.trim();
                let descripcion = document.getElementById("prodDescripcion").value.trim();
                let imagen = document.getElementById("prodImagen").value.trim();
                let peso = document.getElementById("prodPeso").value.trim();
                let presentacion = document.getElementById("prodPresentacion").value.trim();
                let contenido = document.getElementById("prodContenido").value.trim();
                let alias = document.getElementById("prodAlias").value.trim();
                let sinonimos = document.getElementById("prodSinonimos").value.trim();
                let esCigarrillo = document.getElementById("prodEsCigarrillo").checked;
                if (editId) {
                    let idx = productos.findIndex(p => p.id == editId);
                    if (idx !== -1) productos[idx] = { ...productos[idx], nombre, precio, costo, stock, emoji,
                        proveedorId: provId, categoriaId: catId, codigo, vencimiento: null, tipoVenta,
                        precioPorKilo: (tipoVenta === 'peso' ? precioKg : null),
                        precioEspecial: (precioEspecial && precioEspecial > 0) ? precioEspecial : null,
                        horaInicioEspecial: horaInicio,
                        horaFinEspecial: horaFin,
                        marca, descripcion, imagen, peso, presentacion, contenido, alias, sinonimos, esCigarrillo
                    };
                    toast("Producto actualizado");
                } else {
                    let newId = Date.now();
                    productos.push({
                        id: newId,
                        nombre, precio, costo, stock, emoji,
                        proveedorId: provId, categoriaId: catId, codigo,
                        ventasTotales: 0, vencimiento: null,

                        horaFinEspecial: horaFin,
                        marca, descripcion, imagen, peso, presentacion, contenido, alias, sinonimos, esCigarrillo
                    });
                    toast("Producto agregado");
                }

                if (document.getElementById("ventas").classList.contains("active")) renderVentas();

                document.getElementById("prodCodigo").value = "";
                document.getElementById("prodProv").value = "";
                document.getElementById("prodCategoria").value = "";
                document.getElementById("editProdId").value = "";
                document.getElementById("prodTipoVenta").value = "unidad";
                document.getElementById("prodPrecioPorKilo").value = "";
                document.getElementById("prodPrecioEspecial").value = "";
                document.getElementById("prodHoraInicio").value = "";
                document.getElementById("prodHoraFin").value = "";

                document.getElementById("prodImagen").value = "";

                document.getElementById("prodPresentacion").value = "";
                document.getElementById("prodContenido").value = "";
                document.getElementById("prodAlias").value = "";
                document.getElementById("prodSinonimos").value = "";
                document.getElementById("prodEsCigarrillo").checked = false;

            renderTablaConFiltro();
            renderCategoriasAdmin();

        // ===== RENDER EMPLEADOS EN ADMIN =====
        function renderEmpleadosAdmin() {
            const container = document.getElementById("empleadosAdminContainer");
            if (!container) return;
            limpiarEmpleadosDuplicados();
            let html = `<table class="data-table"><thead><tr><th>ID</th><th>Nombre</th><th>Estado Pago</th><th>Acciones</th></tr></thead><tbody>`;
            if (empleados.length === 0) {
                html += `<tr><td colspan="4" style="text-align:center;">No hay empleados registrados</td></tr>`;
            } else {
                empleados.forEach(emp => {
                    const estadoPago = emp.estadoPago === 'pagado' ? '✅ Pagado' : '❌ Pendiente';
                    html += `<tr>
                        <td>${emp.id}</td>
                        <td>${escapeHtml(emp.nombre)}</td>
                        <td>${estadoPago}</td>
                        <td>
                            <button class="btn btn-outline" onclick="editarEmpleadoAdmin(${emp.id})">✏️ Editar</button>
                            <button class="btn btn-danger" onclick="eliminarEmpleadoAdmin(${emp.id})">🗑️ Eliminar</button>
                        </td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.eliminarEmpleadoAdmin = (id) => {
            const emp = empleados.find(e => e.id === id);
            if (!emp) { toast("Empleado no encontrado", true); return; }
            if (!confirm(`⚠️ ¿Eliminar a "${emp.nombre}" definitivamente?\nSe borrarán todos sus turnos y ya no podrá iniciar sesión.`)) return;

            empleados = empleados.filter(e => e.id !== id);
            turnos = turnos.filter(t => t.empleadoId !== id);
            if (currentEmployeeId === id) {
                userMode = "admin";
                currentEmployeeId = null;
                localStorage.setItem(PREF + 'userMode', 'admin');
                localStorage.removeItem(PREF + 'currentEmployeeId');
                actualizarModoUsuarioUI();
                toast(`Empleado "${emp.nombre}" eliminado. Sesión cambiada a Administrador.`);
            } else {
                toast(`Empleado "${emp.nombre}" eliminado correctamente.`);
            }
            guardarEmpleadosTurnos();
            saveAll();
            renderEmpleadosAdmin();
            if (document.getElementById("turnos").classList.contains("active")) renderTurnos();
            const configEmpList = document.getElementById('employeeListConfig');
            if (configEmpList) renderEmployeeListConfig();
        };

        window.editarEmpleadoAdmin = (id) => {
            const emp = empleados.find(e => e.id === id);
            if (!emp) return;
            const nuevoNombre = prompt("Nuevo nombre:", emp.nombre);
            if (nuevoNombre && nuevoNombre.trim()) {
                emp.nombre = nuevoNombre.trim();
                saveAll();
                renderEmpleadosAdmin();
                if (document.getElementById("turnos").classList.contains("active")) renderTurnos();
                const configEmpList = document.getElementById('employeeListConfig');
                if (configEmpList) renderEmployeeListConfig();
                toast("Empleado actualizado");
            }
        };

        function renderEmployeeListConfig() {
            const container = document.getElementById('employeeListConfig');
            if (!container) return;
            limpiarEmpleadosDuplicados();
            if (empleados.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">No hay empleados registrados.</p>';
                return;
            }
            let html = '';
            empleados.forEach(emp => {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid var(--border);">
                    <span>${escapeHtml(emp.nombre)}</span>
                    <div>
                        <button class="btn btn-outline" style="padding:2px 12px; font-size:0.8rem;" onclick="editarEmpleadoAdmin(${emp.id})">✏️</button>
                        <button class="btn btn-danger" style="padding:2px 12px; font-size:0.8rem;" onclick="eliminarEmpleadoAdmin(${emp.id})">🗑️</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderCategoriasAdmin() {
            let div = document.getElementById("categoriasAdmin");
            if (!div) return;
            div.innerHTML = `
                <div style="display:flex; gap:10px; margin-bottom:12px;">
                    <input id="nuevaCategoria" placeholder="Nueva categoría" style="flex:1; padding:10px; border-radius:14px;">
                    <button id="addCategoriaBtn" class="btn btn-primary">+ Agregar</button>
                </div>
                <ul style="font-size:1rem;">${categorias.map(c=>`<li style="margin:6px 0;">${escapeHtml(c.nombre)} <button class="btn btn-outline" onclick="eliminarCategoria(${c.id})">Eliminar</button></li>`).join('')}</ul>
            `;
            document.getElementById("addCategoriaBtn")?.addEventListener("click", () => {
                let nombre = document.getElementById("nuevaCategoria").value.trim();
                if (nombre && !categorias.find(c => c.nombre === nombre)) {
                    categorias.push({ id: Date.now(), nombre });
                    saveAll();
                    renderCategoriasAdmin();
                    if (document.getElementById("admin").classList.contains("active")) renderAdmin();
                    if (document.getElementById("ventas").classList.contains("active")) renderVentas();
                    toast("Categoría agregada");
                } else toast("Nombre inválido o duplicado", true);
            });
        }

        window.eliminarCategoria = (id) => {
            if (confirm("Eliminar categoría?")) {
                categorias = categorias.filter(c => c.id !== id);
                productos.forEach(p => { if (p.categoriaId == id) p.categoriaId = null; });
                saveAll();
                renderCategoriasAdmin();
                if (document.getElementById("admin").classList.contains("active")) renderAdmin();
                if (document.getElementById("ventas").classList.contains("active")) renderVentas();
                toast("Categoría eliminada");
            }
        };

        // ========================================================================
        //  CONFIG
        // ========================================================================
        function showConfig() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <button class="modal-close-btn" id="configCloseBtn" title="Cerrar configuración">✕</button>

                    <div class="config-group"><label>📦 Umbral de stock bajo (unidades)</label><input id="confStock" type="number" value="${config.lowStockThreshold}" placeholder="Stock mínimo"></div>

        function actualizarCajaUI(fechaStr) {
            const resumenDiv = document.getElementById("cajaResumen");
            const movimientosDiv = document.getElementById("cajaMovimientos");
            if (!resumenDiv || !movimientosDiv) return;

            const hoy = toLocalDateStr(new Date());
            const esHoy = fechaStr === hoy;
            const esFuturo = fechaStr > hoy;

            // Si es futuro, la caja está en cero y cerrada
            let ef = 0,
                tr = 0,
                total = 0;
            let movs = [];
            let estado = 'Cerrada';
            let aperturaFecha = null;

            if (esFuturo) {
                // Días futuros: todo cero, cerrada, sin movimientos
                estado = 'Cerrada (día futuro)';
                movs = [];
            } else if (esHoy && !caja.apertura) {
                // Hoy y caja cerrada: mostrar cero (los movimientos se limpiaron al cerrar)
                estado = 'Cerrada';
                movs = [];
                ef = 0; tr = 0; total = 0;
            } else {
                // Día actual (abierta) o pasado: calcular según movimientos hasta la fecha
                movs = caja.movimientos.filter(m => {
                    const mDateStr = toLocalDateStr(m.fecha);
                    return mDateStr <= fechaStr;
                });
                // Recalcular desde cero
                ef = 0;
                tr = 0;
                for (let m of movs) {
                    if (m.tipo === 'ingreso') {
                        if (m.metodo === 'efectivo') ef += m.monto;
                        else tr += m.monto;
                    } else if (m.tipo === 'retiro') {
                        if (m.metodo === 'efectivo') ef -= m.monto;
                        else tr -= m.monto;
                    }
                }
                total = ef + tr;
                estado = caja.apertura && esHoy ? `Abierta desde ${new Date(caja.apertura).toLocaleString()}` : 'Cerrada';

                    <div class="kpi-card"><div class="kpi-title">💳 Transferencia</div><div class="kpi-value">$${tr.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">💵 Total Caja</div><div class="kpi-value">$${total.toFixed(2)}</div></div>

                        <button id="cerrarCajaBtn" class="btn btn-danger">🔒 Cerrar Caja</button>
                        <button id="exportMovimientosBtn" class="btn btn-outline">📎 Exportar CSV</button>
                        <button id="borrarMovimientosBtn" class="btn btn-danger">🗑️ Borrar movimientos</button>
                    ` : `<span style="color:var(--text-muted);">${esFuturo ? 'No se pueden ver movimientos de días futuros.' : 'Caja cerrada o vista histórica - solo lectura'}</span>`}

            } else {

                            <option value="retiro">Retiros</option>

                const PAGE_SIZE = 50;
                let movPage = 0;

                function renderMovimientos() {
                    const tipoFiltro = document.getElementById('filtroTipoMov')?.value || 'all';

                    if (metodoFiltro !== 'all') filtered = filtered.filter(m => (m.metodo || 'efectivo') === metodoFiltro);

                    // Paginación

                    pagDiv.innerHTML = `

                        if (movPage > 0) { movPage--; renderMovimientos(); }

                        if (movPage < totalPages - 1) { movPage++; renderMovimientos(); }

                document.getElementById('filtroTipoMov')?.addEventListener('change', renderMovimientos);
                document.getElementById('filtroMetodoMov')?.addEventListener('change', renderMovimientos);

                // Botones solo si está abierta hoy
                if (esHoy && caja.apertura) {

                                <select id="movMetodo" style="font-size:1rem;"><option value="efectivo">💰 Efectivo</option><option value="transferencia">💳 Transferencia</option></select>
                                <input type="number" id="movMonto" placeholder="Monto" step="0.01" min="0">
                                <input type="text" id="movDesc" placeholder="Descripción">
                                <div style="display:flex; gap:14px; margin-top:18px;">

                            let tipo = document.getElementById("movTipo").value;
                            let metodo = document.getElementById("movMetodo").value;
                            let monto = parseFloat(document.getElementById("movMonto").value);
                            let desc = document.getElementById("movDesc").value.trim() || "Movimiento";

                                descripcion: desc,

                            caja._version = Date.now() + Math.random();
                            saveAll();
                            actualizarCajaUI(fechaStr);
