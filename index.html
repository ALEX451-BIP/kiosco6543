        function exportarMovimientosCSV(movs) {
            if (!movs || !movs.length) { toast("No hay movimientos", true); return; }
            function escCsv(v) {
                const s = String(v);
                if (s.includes(';') || s.includes('"') || s.includes('\n')) {
                    return '"' + s.replace(/"/g, '""') + '"';
                }
                return s;
            }
            const rows = [["Fecha", "Tipo", "Método", "Monto", "Descripción"]];
            movs.forEach(m => {
                rows.push([new Date(m.fecha).toLocaleString(), m.tipo, m.metodo || 'efectivo', m.monto.toFixed(2), m.descripcion || '']);
            });
            const csvContent = rows.map(row => row.map(escCsv).join(";")).join("\n");
            const BOM = "\uFEFF";
            const blob = new Blob([BOM + csvContent], { type: "text/csv;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `movimientos_caja_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            toast("Movimientos exportados a CSV");
        }

                    return;
                }

            actualizarSaldoCaja();
            const esperadoEf = caja.efectivo;

            const hoy = toLocalDateStr(new Date());
            const ventasHoy = ventas.filter(v => !v.devuelta && toLocalDateStr(v.fecha) === hoy);
            const totalVentasHoy = ventasHoy.reduce((s, v) => s + v.total, 0);
            const cantidadVentas = ventasHoy.length;
            const metodosPago = {};
            ventasHoy.forEach(v => {

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `

                        <p><strong>📊 Resumen del día (${hoy})</strong></p>
                        <p>Ventas: ${cantidadVentas} transacciones - Total: $${totalVentasHoy.toFixed(2)}</p>
                        <p>${Object.entries(metodosPago).map(([metodo, monto]) => `${metodo}: $${monto.toFixed(2)}`).join(' | ')}</p>
                    </div>
                    <p style="font-size:0.95rem;">Declara los montos reales en caja:</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div><label>💰 Efectivo esperado: <strong>$${esperadoEf.toFixed(2)}</strong></label>
                            <input type="number" id="arqueoEfectivo" placeholder="Efectivo real" step="0.01" min="0" value="${esperadoEf.toFixed(2)}" style="font-size:1rem;"></div>
                        <div><label>💳 Transferencia esperada: <strong>$${esperadoTr.toFixed(2)}</strong></label>
                            <input type="number" id="arqueoTransferencia" placeholder="Transferencia real" step="0.01" min="0" value="${esperadoTr.toFixed(2)}" style="font-size:1rem;"></div>
                    </div>
                    <div style="margin:12px 0; font-size:1.1rem; font-weight:700;">
                        Total esperado: $${esperadoTotal.toFixed(2)}
                    </div>
                    <div id="diferenciaArqueo" style="font-size:1.1rem; font-weight:700; color:var(--warning);"></div>
                    <div style="margin-top:12px;">
                        <label>Observaciones (opcional)</label>
                        <input type="text" id="notaCierre" placeholder="Notas sobre el cierre" style="width:100%; font-size:1rem;">
                    </div>
                    <div style="display:flex; gap:14px; margin-top:18px; flex-wrap:wrap; justify-content:center;">
                        <button id="confirmarCierreBtn" class="btn btn-primary">✅ Cerrar Caja</button>
                        <button id="cancelarCierreBtn" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const efInput = modal.querySelector('#arqueoEfectivo');
            const trInput = modal.querySelector('#arqueoTransferencia');
            const diffSpan = modal.querySelector('#diferenciaArqueo');

            function validarMontos() {
                const efVal = parseFloat(efInput.value);
                const trVal = parseFloat(trInput.value);
                if (efVal < 0) efInput.value = 0;
                if (trVal < 0) trInput.value = 0;
            }

            function calcularDiferencia() {
                validarMontos();
                const efReal = parseFloat(efInput.value) || 0;
                const trReal = parseFloat(trInput.value) || 0;
                const realTotal = Math.round((efReal + trReal) * 100) / 100;
                const diff = Math.round((realTotal - esperadoTotal) * 100) / 100;
                if (Math.abs(diff) < 0.001) {
                    diffSpan.innerHTML = '✅ Coincide exactamente.';
                    diffSpan.style.color = 'var(--success)';
                } else if (diff > 0) {
                    diffSpan.innerHTML = `⚠️ Sobran $${diff.toFixed(2)} en la caja.`;
                    diffSpan.style.color = 'var(--warning)';
                } else {
                    diffSpan.innerHTML = `⚠️ Faltan $${Math.abs(diff).toFixed(2)} en la caja.`;
                    diffSpan.style.color = 'var(--danger)';
                }
                return { efReal, trReal, realTotal, diff };
            }

            efInput.addEventListener('input', calcularDiferencia);
            trInput.addEventListener('input', calcularDiferencia);
            calcularDiferencia();

            let cerrando = false;
            modal.querySelector('#confirmarCierreBtn').onclick = () => {
                if (cerrando) return;
                cerrando = true;
                const btn = modal.querySelector('#confirmarCierreBtn');
                btn.disabled = true;
                btn.textContent = '⏳ Cerrando...';
                const { efReal, trReal, realTotal, diff } = calcularDiferencia();
                const nota = modal.querySelector('#notaCierre').value.trim() || '';
                if (!caja.cierres) caja.cierres = [];
                const cierre = {
                    fecha: new Date().toISOString(),
                    esperado: esperadoTotal,
                    real: realTotal,
                    efEsperado: esperadoEf,
                    trEsperado: esperadoTr,
                    efReal: efReal,
                    trReal: trReal,
                    detalle: `Efectivo esperado $${esperadoEf.toFixed(2)}, real $${efReal.toFixed(2)} | Transferencia esperada $${esperadoTr.toFixed(2)}, real $${trReal.toFixed(2)}`,
                    nota: nota,
                    ventasDelDia: totalVentasHoy,
                    cantidadVentas: cantidadVentas,
                    metodosPago: metodosPago
                };
                const diffAbs = Math.round(Math.abs(diff) * 1000) / 1000;
                if (diffAbs > 0.001) {
                    if (confirm(`Hay una diferencia de $${diff.toFixed(2)}. ¿Deseas registrar un ajuste automático para corregir el saldo?`)) {
                        const ajusteTipo = diff > 0 ? 'retiro' : 'ingreso';
                        const ajusteMonto = Math.abs(diff);
                        caja.movimientos.push({
                            fecha: new Date().toISOString(),
                            tipo: ajusteTipo,
                            monto: Math.round(ajusteMonto * 100) / 100,
                            descripcion: `Ajuste de arqueo (${diff > 0 ? 'sobrante' : 'faltante'})`,
                            metodo: 'efectivo'
                        });
                        cierre.ajuste = { tipo: ajusteTipo, monto: Math.round(ajusteMonto * 100) / 100 };
                        actualizarSaldoCaja();
                        toast(`Ajuste de $${ajusteMonto.toFixed(2)} registrado.`);
                    }
                }
                caja.cierres.push(cierre);
                // Podar cierres viejos (más de 365 días)
                const limite = Date.now() - 365 * 24 * 60 * 60 * 1000;
                caja.cierres = caja.cierres.filter(c => new Date(c.fecha).getTime() > limite);

                // ========== LIMPIEZA TOTAL DE LA CAJA PARA LA PRÓXIMA APERTURA ==========
                caja.cerradaEn = new Date().toISOString();
                caja.apertura = null;
                caja.montoAperturaEfectivo = 0;
                caja.montoAperturaTransferencia = 0;
                caja.efectivo = 0;
                caja.transferencia = 0;
                caja.movimientos = [];
                caja._version = Date.now() + Math.random();

                saveAll();
                modal.remove();
                actualizarCajaUI(toLocalDateStr(new Date()));
                renderHistorialCierres();
                actualizarHeader();
                toast("🔒 Caja cerrada con arqueo registrado. Todo reiniciado para la próxima apertura.");
            };

            modal.querySelector('#cancelarCierreBtn').onclick = () => modal.remove();
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        function renderHistorialCierres() {
            const container = document.getElementById("historialCierresContainer");
            if (!container) return;
            if (!caja.cierres || caja.cierres.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">No hay registros de cierres.</p>';
                return;
            }
            let html = `<table class="data-table"><thead><tr><th>Fecha cierre</th><th>Esperado</th><th>Declarado</th><th>Diferencia</th><th>Ajuste</th><th>Detalle</th><th>Ventas día</th></tr></thead><tbody>`;
            caja.cierres.slice().reverse().forEach(c => {
                const diff = c.real - c.esperado;
                const diffText = diff >= 0 ? `+${diff.toFixed(2)}` : diff.toFixed(2);
                const diffColor = Math.abs(diff) < 0.01 ? 'var(--success)' : 'var(--danger)';
                const ventasStr = c.ventasDelDia ? `$${c.ventasDelDia.toFixed(2)} (${c.cantidadVentas || 0} ventas)` : '-';
                html += `<tr>
                    <td>${new Date(c.fecha).toLocaleString()}</td>
                    <td>$${c.esperado.toFixed(2)}</td>
                    <td>$${c.real.toFixed(2)}</td>
                    <td style="color:${diffColor}; font-weight:700;">${diffText}</td>
                    <td>${c.ajuste ? `$${c.ajuste.monto.toFixed(2)} (${c.ajuste.tipo})` : 'Ninguno'}</td>
                    <td>${c.detalle || ''}${c.nota ? ' - Nota: '+escapeHtml(c.nota) : ''}</td>
                    <td>${ventasStr}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        async function resetContabilidad() {
            if (!await ensureAdmin()) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:450px; text-align:center;">
                    <h3 style="color: var(--danger);">⚠️ Reiniciar Contabilidad</h3>
                    <p style="margin:16px 0; font-size:1rem;">¿Estás absolutamente seguro?</p>
                    <p style="font-size:0.9rem; background:var(--bg-page); padding:12px; border-radius:10px;">
                        Esta acción eliminará:<br>
                        - 📉 Todo el historial de ventas<br>
                        - 💸 Todos los gastos registrados<br>
                        - 💰 Todos los movimientos de caja<br>
                        - 🔒 Cerrará la caja actual<br><br>
                        <strong>No se puede deshacer.</strong>
                    </p>
                    <div style="display:flex; gap:14px; justify-content:center; margin-top:20px;">
                        <button id="confirmResetBtn" class="btn btn-danger">✅ Sí, reiniciar todo</button>
                        <button id="cancelResetBtn" class="btn btn-outline">❌ Cancelar</button>

            `;
            document.body.appendChild(modal);
            const confirmBtn = modal.querySelector('#confirmResetBtn');

                caja.movimientos = [];
                caja.cerradaEn = new Date().toISOString();
                caja.apertura = null;
                caja.montoAperturaEfectivo = 0;
                caja.montoAperturaTransferencia = 0;
                caja.efectivo = 0;
                caja.transferencia = 0;
                caja.cierres = [];
                turnoActivo = null;
                saveAll();
                renderContabilidad();
                actualizarHeader();
                toast("✅ Contabilidad reiniciada correctamente");
                modal.remove();
            };
            cancelBtn.onclick = () => { modal.remove();
                toast("Reinicio cancelado", false); };

        function getAccountingDateRange() {
            let start, end = new Date();
            if (accountingPeriod === 'today') {
                start = new Date();
                start.setHours(0, 0, 0, 0);
                end = new Date();
                end.setHours(23, 59, 59, 999);
            } else if (accountingPeriod === 'week') {
                start = new Date();
                start.setDate(start.getDate() - start.getDay() + (start.getDay() === 0 ? -6 : 1));
                start.setHours(0, 0, 0, 0);
                end = new Date();
                end.setHours(23, 59, 59, 999);
            } else if (accountingPeriod === 'month') {
                start = new Date();
                start.setDate(1);
                start.setHours(0, 0, 0, 0);
                end = new Date();
                end.setHours(23, 59, 59, 999);
            } else if (accountingPeriod === 'custom') {
                start = new Date(document.getElementById('startDate')?.value);
                end = new Date(document.getElementById('endDate')?.value);
                end.setHours(23, 59, 59, 999);
            }
            return { start, end };
        }

        function destroyAccountingCharts() {
            if (accountingChart) { accountingChart.destroy();
                accountingChart = null; }
            if (expensesCategoryChart) { expensesCategoryChart.destroy();
                expensesCategoryChart = null; }
            if (topExpenseCatChart) { topExpenseCatChart.destroy();
                topExpenseCatChart = null; }
            if (ingresosGastosPieChart) { ingresosGastosPieChart.destroy();
                ingresosGastosPieChart = null; }
        }

        function actualizarContabilidad() {
            destroyAccountingCharts();
            const { start, end } = getAccountingDateRange();
            const ventasPeriodo = ventas.filter(v => !v.devuelta && new Date(v.fecha) >= start && new Date(v.fecha) <= end);
            const totalVentas = ventasPeriodo.reduce((s, v) => s + v.total, 0);
            const gastosPeriodo = gastos.filter(g => new Date(g.fecha) >= start && new Date(g.fecha) <= end);
            const totalGastos = gastosPeriodo.reduce((s, g) => s + g.monto, 0);
            const gananciaNeta = totalVentas - totalGastos;
            const margenNeto = totalVentas > 0 ? (gananciaNeta / totalVentas) * 100 : 0;
            const gananciaBruta = ventasPeriodo.reduce((s, v) => s + (v.ganancia || 0), 0);
            const margenBruto = totalVentas > 0 ? (gananciaBruta / totalVentas) * 100 : 0;

            actualizarSaldoCaja();
            const saldoCaja = calcularSaldoCaja();

            const kpiDiv = document.getElementById("accountingKpiGrid");
            if (kpiDiv) kpiDiv.innerHTML = `
                <div class="kpi-card"><div class="kpi-title">💰 Ventas totales</div><div class="kpi-value">$${totalVentas.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">📉 Gastos totales</div><div class="kpi-value">$${totalGastos.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">💵 Ganancia Neta</div><div class="kpi-value">$${gananciaNeta.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">📊 Margen Neto</div><div class="kpi-value">${margenNeto.toFixed(1)}%</div></div>
                <div class="kpi-card"><div class="kpi-title">📈 Margen Bruto</div><div class="kpi-value">${margenBruto.toFixed(1)}%</div></div>
                <div class="kpi-card"><div class="kpi-title">💲 Saldo Caja</div><div class="kpi-value">$${saldoCaja.toFixed(2)}</div></div>
            `;

            const daysDiff = Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1);
            const labels = [];
            const ventasDaily = [];
            const gastosDaily = [];
            for (let i = 0; i < daysDiff; i++) {
                const day = new Date(start);
                day.setDate(start.getDate() + i);
                const dayStr = day.toISOString().split('T')[0];
                labels.push(day.toLocaleDateString('es', { day: 'numeric', month: 'short' }));
                const ventasDay = ventasPeriodo.filter(v => new Date(v.fecha).toISOString().split('T')[0] === dayStr)
                    .reduce((s, v) => s + v.total, 0);
                const gastosDay = gastosPeriodo.filter(g => new Date(g.fecha).toISOString().split('T')[0] === dayStr)
                    .reduce((s, g) => s + g.monto, 0);
                ventasDaily.push(ventasDay);
                gastosDaily.push(gastosDay);
            }

            const ctxLine = document.getElementById('accountingLineChart')?.getContext('2d');
            if (ctxLine) {
                accountingChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            { label: 'Ventas ($)', data: ventasDaily, borderColor: '#d63384',
                                backgroundColor: 'rgba(214,51,132,0.1)', tension: 0.3, fill: true },
                            { label: 'Gastos ($)', data: gastosDaily, borderColor: '#dc2626',
                                backgroundColor: 'rgba(220,38,38,0.1)', tension: 0.3, fill: true }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: true }
                });
            }

            const catMap = new Map();
            gastosPeriodo.forEach(g => { const cat = g.categoria || "General";
                catMap.set(cat, (catMap.get(cat) || 0) + g.monto); });
            const pieCtx = document.getElementById('expensesPieChart')?.getContext('2d');
            if (pieCtx) {
                if (catMap.size === 0) {
                    pieCtx.clearRect(0, 0, pieCtx.canvas.width, pieCtx.canvas.height);
                    pieCtx.fillStyle = '#94a3b8';
                    pieCtx.font = '14px system-ui';
                    pieCtx.fillText('Sin gastos', 20, 100);
                } else {
                    expensesCategoryChart = new Chart(pieCtx, {
                        type: 'pie',
                        data: {
                            labels: Array.from(catMap.keys()),
                            datasets: [{ data: Array.from(catMap.values()), backgroundColor: ['#d63384',
                                    '#f59e0b', '#10b981', '#8b5cf6', '#dc2626', '#64748b'
                                ] }]
                        },
                        options: { responsive: true, maintainAspectRatio: true }
                    });
                }
            }

            const sortedCats = Array.from(catMap.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const barCtx = document.getElementById('topExpenseCatChart')?.getContext('2d');
            if (barCtx) {
                if (sortedCats.length === 0) {
                    barCtx.clearRect(0, 0, barCtx.canvas.width, barCtx.canvas.height);
                    barCtx.fillStyle = '#94a3b8';
                    barCtx.font = '14px system-ui';
                    barCtx.fillText('Sin datos', 20, 100);
                } else {
                    topExpenseCatChart = new Chart(barCtx, {
                        type: 'bar',
                        data: {
                            labels: sortedCats.map(c => c[0]),
                            datasets: [{ label: 'Monto gastado ($)', data: sortedCats.map(c => c[1]),
                                backgroundColor: '#f59e0b' }]
                        },
                        options: { responsive: true, maintainAspectRatio: true, indexAxis: 'y' }
                    });
                }
            }

            const ingresosGastosCtx = document.getElementById('ingresosGastosPieChart')?.getContext('2d');
            if (ingresosGastosCtx) {
                if (totalVentas === 0 && totalGastos === 0) {
                    ingresosGastosCtx.clearRect(0, 0, ingresosGastosCtx.canvas.width, ingresosGastosCtx.canvas
                        .height);
                    ingresosGastosCtx.fillStyle = '#94a3b8';
                    ingresosGastosCtx.font = '14px system-ui';
                    ingresosGastosCtx.fillText('Sin movimientos', 20, 100);
                } else {
                    ingresosGastosPieChart = new Chart(ingresosGastosCtx, {
                        type: 'pie',
                        data: {
                            labels: ['💰 Ingresos (Ventas)', '📉 Gastos'],
                            datasets: [{ data: [totalVentas, totalGastos], backgroundColor: ['#d63384',
                                    '#dc2626'], borderWidth: 0 }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                tooltip: {
                                    callbacks: {
                                        label: function(ctx) {
                                            let total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                            let pct = ((ctx.raw / total) * 100).toFixed(1);
                                            return `${ctx.label}: $${ctx.raw.toFixed(2)} (${pct}%)`;
                                        }
                                    }
                                },
                                legend: { position: 'bottom' }
                            }
                        }
                    });
                }
            }
            renderTablaGastos();
        }

        function renderTablaGastos() {
            const tbody = document.getElementById("gastosTableBody");
            if (!tbody) return;
            const categoryFilter = document.getElementById("gastoCategoryFilter")?.value || "all";
            const { start, end } = getAccountingDateRange();
            let gastosFiltrados = gastos.filter(g => new Date(g.fecha) >= start && new Date(g.fecha) <= end);
            if (categoryFilter !== "all") {
                gastosFiltrados = gastosFiltrados.filter(g => (g.categoria || "General") === categoryFilter);
            }
            tbody.innerHTML = gastosFiltrados.slice().reverse().map(g =>
                `<tr><td>${new Date(g.fecha).toLocaleString()}</td><td>${escapeHtml(g.desc)}</td><td>${escapeHtml(g.categoria||"General")}</td><td>$${g.monto.toFixed(2)}</td><td><button class="btn btn-danger" onclick="eliminarGasto(${g.id})">Eliminar</button></td></tr>`
                ).join('');
        }

        async function agregarGastoConCategoria() {
            if (!await ensureAdmin()) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>Registrar gasto</h3>
                    <input id="gastoDesc" placeholder="Concepto">
                    <input id="gastoMonto" type="number" placeholder="Monto" step="0.01">

                        <option value="Servicios">Servicios</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <label style="display:flex; align-items:center; gap:8px; font-size:1rem;"><input type="checkbox" id="gastoAfectaCaja" checked> Descontar de caja</label>

                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById("guardarGastoBtn").onclick = () => {
                const desc = document.getElementById("gastoDesc").value.trim();
                const monto = parseFloat(document.getElementById("gastoMonto").value);
                const categoria = document.getElementById("gastoCategoria").value;
                if (!desc || isNaN(monto) || monto <= 0) { toast("Datos inválidos", true); return; }
                gastos.push({ id: Date.now(), fecha: new Date().toISOString(), desc, monto, categoria });
                if (document.getElementById("gastoAfectaCaja").checked && caja.apertura) {
                    caja.movimientos.push({
                        fecha: new Date().toISOString(),
                        tipo: "retiro",
                        monto: monto,
                        descripcion: `Gasto: ${desc} (${categoria})`,
                        metodo: "efectivo"
                    });
                    actualizarSaldoCaja();
                }
                saveAll();
                renderContabilidad();
                if (document.getElementById("caja").classList.contains("active")) renderCaja();
                actualizarHeader();
                toast("Gasto registrado correctamente");
                modal.remove();
            };
            document.getElementById("cancelGastoBtn").onclick = () => modal.remove();
        }

        function exportarGastosCSV() {
            const { start, end } = getAccountingDateRange();
            const gastosPeriodo = gastos.filter(g => new Date(g.fecha) >= start && new Date(g.fecha) <= end);
            if (!gastosPeriodo.length) { toast("No hay gastos en este período", true); return; }
            const rows = [
                ["Fecha", "Concepto", "Categoría", "Monto"]
            ];
            gastosPeriodo.forEach(g => { rows.push([new Date(g.fecha).toLocaleString(), g.desc, g.categoria || "General",
                    g.monto
                ]); });
            const csvContent = rows.map(row => row.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: "text/csv" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `gastos_${accountingPeriod}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            toast("Gastos exportados a CSV");
        }

            if (!await ensureAdmin()) return;

        // ========================================================================
        //  AVISOS
        // ========================================================================
        function obtenerCantidadAvisos() {
            if (!isAdmin && userMode !== 'admin') return 0;
            const hoy = new Date();
            const proximosDias = config.vencimientoAlertDays || 7;
            let count = 0;
            productos.forEach(p => {
                if (p.stock <= config.lowStockThreshold) count++;
                if (p.vencimiento) {
                    const fechaVen = new Date(p.vencimiento);
                    const diffDays = Math.ceil((fechaVen - hoy) / (1000 * 60 * 60 * 24));
                    if (diffDays <= proximosDias) count++;
                }
            });
            return count;
        }

        function actualizarContadorAvisos() {
            const contadorDiv = document.getElementById("alertaContador");
            if (!contadorDiv) return;
            const cantidad = obtenerCantidadAvisos();
            if (cantidad > 0 && (isAdmin || userMode === 'admin')) {
                contadorDiv.style.display = "inline-flex";
                contadorDiv.innerHTML = `🔔 ${cantidad}`;
                contadorDiv.style.background = "#dc2626";
            } else {
                contadorDiv.style.display = "none";
            }
        }

        function verificarAvisos(mostrarSoloSiHayNovedades = false) {
            if (!isAdmin && userMode !== 'admin') return;
            const hoy = new Date();
            const proximosDias = config.vencimientoAlertDays || 7;
            let avisos = [];
            productos.forEach(p => {
                if (p.stock <= config.lowStockThreshold) {
                    avisos.push({ tipo: 'stock', producto: p.nombre, stock: p.stock, umbral: config
                            .lowStockThreshold });
                }
            });
            productos.forEach(p => {
                if (p.vencimiento) {
                    const fechaVen = new Date(p.vencimiento);
                    const diffDays = Math.ceil((fechaVen - hoy) / (1000 * 60 * 60 * 24));
                    if (diffDays <= proximosDias) {
                        avisos.push({ tipo: 'vencimiento', producto: p.nombre, vencimiento: p.vencimiento,
                            dias: diffDays });
                    }
                }
            });

            if (avisos.length === 0) {
                if (!mostrarSoloSiHayNovedades) toast(
                    `✅ No hay productos con stock bajo (mínimo ${config.lowStockThreshold}) ni próximos a vencer (${proximosDias} días).`
                    );
                actualizarContadorAvisos();
                return;
            }

            let avisosHtml =
                `<div class="modal-card" style="max-width:520px;"><h3>🔔 AVISOS IMPORTANTES</h3><p style="font-size:0.9rem; margin-bottom:12px;">⚙️ Umbrales activos: Stock ≤ ${config.lowStockThreshold} | Vencimiento ≤ ${proximosDias} días</p><div style="max-height:400px; overflow-y:auto;">`;
            const avisosStock = avisos.filter(a => a.tipo === 'stock');
            if (avisosStock.length) {
                avisosHtml += `<h4 style="color: var(--danger); margin-top:12px;">📦 Stock bajo (≤ ${config.lowStockThreshold})</h4>`;
                avisosStock.forEach(a => {
                    avisosHtml +=
                        `<div class="aviso-item aviso-stock">⚠️ <strong>${escapeHtml(a.producto)}</strong> - Stock actual: ${a.stock} (mínimo recomendado: ${a.umbral})</div>`;
                });
            }
            const avisosVen = avisos.filter(a => a.tipo === 'vencimiento');
            if (avisosVen.length) {
                avisosHtml +=
                    `<h4 style="color: var(--warning); margin-top:12px;">⏰ Vencimiento próximo (próximos ${proximosDias} días)</h4>`;
                avisosVen.forEach(a => {
                    const texto = a.dias < 0 ? `VENCIDO hace ${Math.abs(a.dias)} días` :
                        `Vence en ${a.dias} días (${new Date(a.vencimiento).toLocaleDateString()})`;
                    avisosHtml +=
                        `<div class="aviso-item aviso-vencimiento">⚠️ <strong>${escapeHtml(a.producto)}</strong> - ${texto}</div>`;
                });
            }
            avisosHtml +=
                `<div style="display:flex; justify-content:flex-end; margin-top:20px;"><button id="cerrarAvisosBtn" class="btn btn-primary">Cerrar</button></div></div></div>`;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = avisosHtml;
            document.body.appendChild(modal);
            document.getElementById("cerrarAvisosBtn").onclick = () => modal.remove();
            actualizarContadorAvisos();
        }

        function renderResumenCajaEmpleado() {
            const container = document.getElementById("resumenCajaEmpleado");
            if (!container) return;

            const estado = caja.apertura ? '✅ Abierta' : '🔒 Cerrada';
            const fechaApertura = caja.apertura ? new Date(caja.apertura).toLocaleString() : 'Nunca';
            const saldoEf = caja.efectivo || 0;
            const saldoTr = caja.transferencia || 0;
            const saldoTotal = saldoEf + saldoTr;

            const hoy = toLocalDateStr(new Date());
            const ventasHoy = ventas.filter(v => !v.devuelta && toLocalDateStr(v.fecha) === hoy);
            const totalVentasHoy = ventasHoy.reduce((s, v) => s + v.total, 0);

            let ventasDesdeApertura = 0;
            if (caja.apertura) {
                const fechaAper = new Date(caja.apertura);
                ventasDesdeApertura = ventas.filter(v => !v.devuelta && new Date(v.fecha) >= fechaAper)
                    .reduce((s, v) => s + v.total, 0);
            }
            const totalEsperado = caja.apertura ? caja.montoAperturaEfectivo + caja.montoAperturaTransferencia + ventasDesdeApertura : 0;
            const diferencia = saldoTotal - totalEsperado;

            container.innerHTML = `
                <h3 style="margin-bottom:12px;">💰 Resumen de Caja</h3>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:12px;">
                    <div class="kpi-card"><div class="kpi-title">Estado</div><div class="kpi-value" style="font-size:1.4rem;">${estado}</div></div>
                    ${caja.apertura ? `<div class="kpi-card"><div class="kpi-title">Apertura</div><div class="kpi-value" style="font-size:1rem;">${fechaApertura}</div></div>` : ''}
                    <div class="kpi-card"><div class="kpi-title">Efectivo</div><div class="kpi-value">$${saldoEf.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">Transferencia</div><div class="kpi-value">$${saldoTr.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">Total Caja</div><div class="kpi-value">$${saldoTotal.toFixed(2)}</div></div>
                    <div class="kpi-card"><div class="kpi-title">Ventas del día</div><div class="kpi-value">$${totalVentasHoy.toFixed(2)}</div></div>
                    ${caja.apertura ? `
                        <div class="kpi-card"><div class="kpi-title">Ventas desde apertura</div><div class="kpi-value">$${ventasDesdeApertura.toFixed(2)}</div></div>
                        <div class="kpi-card" style="border-color: ${Math.abs(diferencia) < 0.01 ? 'var(--success)' : 'var(--danger)'};">
                            <div class="kpi-title">Diferencia (real - esperado)</div>
                            <div class="kpi-value" style="color: ${Math.abs(diferencia) < 0.01 ? 'var(--success)' : 'var(--danger)'};">
                                ${diferencia >= 0 ? '+' : ''}$${diferencia.toFixed(2)}
                            </div>
                        </div>
                        ${!caja.apertura ? `<button id="abrirCajaDesdeTurnos" class="btn btn-success" style="grid-column: span 2; justify-self:center;">🔓 Abrir Caja</button>` : ''}
                    ` : `
                        <div style="grid-column: span 2; display:flex; justify-content:center; margin-top:8px;">
                            <button id="abrirCajaDesdeTurnos" class="btn btn-success">🔓 Abrir Caja</button>
                        </div>
                    `}
                </div>
            `;

            document.getElementById("abrirCajaDesdeTurnos")?.addEventListener("click", abrirCajaConMonto);
        }

        function renderVentasPorEmpleado() {
            const container = document.getElementById("ventasPorEmpleadoContainer");
            if (!container) return;
            const hoy = new Date().toDateString();
            const ventasHoy = ventas.filter(v => !v.devuelta && new Date(v.fecha).toDateString() === hoy);

            const mapa = new Map();
            ventasHoy.forEach(v => {
                const id = v.vendedorId || 'sin_asignar';
                if (!mapa.has(id)) mapa.set(id, { total: 0, count: 0, items: [] });
                const data = mapa.get(id);
                data.total += v.total;
                data.count++;
                data.items.push(v);
            });

            let html = `<table class="data-table"><thead><tr><th>Empleado</th><th>Ventas</th><th>Total Vendido</th><th>Ticket Promedio</th></tr></thead><tbody>`;
            if (mapa.size === 0) {
                html += `<tr><td colspan="4" style="text-align:center;">No hay ventas hoy</td></tr>`;
            } else {
                for (let [id, data] of mapa) {
                    let nombre = 'Sin asignar';
                    if (id !== 'sin_asignar') {
                        const emp = empleados.find(e => e.id === id);
                        if (emp) nombre = emp.nombre;
                    }
                    const promedio = data.count > 0 ? data.total / data.count : 0;
                    html += `<tr>
                        <td>${escapeHtml(nombre)}</td>
                        <td>${data.count}</td>
                        <td>$${data.total.toFixed(2)}</td>
                        <td>$${promedio.toFixed(2)}</td>
                    </tr>`;
                }
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

            const nombre = prompt("Nombre del nuevo empleado:");
            if (nombre && nombre.trim()) {
                empleados.push({ id: Date.now(), nombre: nombre.trim(), activo: true, estadoPago: "pendiente",
                pagos: [] });
                saveAll();
                renderTurnos();
                toast("Empleado agregado correctamente");
            }
        }

            const container = document.getElementById("calendarioTurnos");
            if (!container) return;
            let html = "";
            for (let i = 0; i < diasSemana.length; i++) {
                const turnosDia = turnos.filter(t => t.dia === i);
                html += `<div class="dia-row">
                    <div class="dia-header">
                        <span>${diasSemana[i]}</span>
                        <button class="btn btn-primary agregar-turno" data-dia="${i}">+ Turno</button>
                    </div>
                    <div class="turnos-list">`;
                if (turnosDia.length === 0) html += `<div class="empty-turnos">Sin turnos asignados</div>`;
                else turnosDia.forEach(t => {
                    const emp = empleados.find(e => e.id === t.empleadoId);
                    if (!emp) return;
                    const estadoPago = emp.estadoPago === 'pagado' ? '✅ Pagado' : '❌ Pendiente';
                    const estadoClass = emp.estadoPago === 'pagado' ? 'pago-pagado' : 'pago-pendiente';
                    html += `<div class="turno-item">
                        <div class="turno-info">

                            <span class="pago-estado ${estadoClass}">💰 ${estadoPago}</span>
                        </div>
                        <div class="turno-actions">

                            <button class="btn btn-outline" onclick="verHistorialPagosEmpleado(${emp.id})">📜 Historial</button>
                            <button class="btn btn-outline" onclick="editarTurno(${t.id})">✏️</button>
                            <button class="btn btn-danger" onclick="eliminarTurno(${t.id})">🗑️</button>
                        </div>
                    </div>`;

                html += `</div></div>`;

            container.innerHTML = html;
            document.querySelectorAll('.agregar-turno').forEach(btn => btn.addEventListener('click', (e) =>
                abrirAgregarTurno(parseInt(btn.dataset.dia))));

            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card">
                    <h3>➕ Agregar turno - ${diasSemana[dia]}</h3>
                    <select id="empleadoSelect" style="font-size:1rem;">${empleados.filter(e=>e.activo).map(e=>`<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('')}</select>
                    <input type="time" id="horaInicio" value="09:00" style="font-size:1rem;">
                    <input type="time" id="horaFin" value="18:00" style="font-size:1rem;">

                    </div>
                </div>

            if (!await ensureAdmin()) return;
            const turno = turnos.find(t => t.id === id);

            const modal = document.createElement('div');

                    <h3>✏️ Editar turno</h3>
                    <select id="empleadoSelect" style="font-size:1rem;">${empleados.filter(e=>e.activo).map(e=>`<option value="${e.id}" ${e.id===turno.empleadoId?'selected':''}>${escapeHtml(e.nombre)}</option>`).join('')}</select>

                    <input type="time" id="horaFin" value="${turno.horaFin}" style="font-size:1rem;">

                        <button id="guardarBtn" class="btn btn-primary">Guardar</button>
                        <button id="cancelBtn" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;

            modal.querySelector('#guardarBtn').onclick = () => {
                const empleadoId = parseInt(modal.querySelector('#empleadoSelect').value);
                const horaInicio = modal.querySelector('#horaInicio').value;
                const horaFin = modal.querySelector('#horaFin').value;
                if (empleadoId && horaInicio && horaFin && horaInicio < horaFin) {
                    if (haySolapamiento(turno.dia, horaInicio, horaFin, turno.id)) { toast("Horario ocupado",
                        true); return; }
                    turno.empleadoId = empleadoId;
                    turno.horaInicio = horaInicio;
                    turno.horaFin = horaFin;
                    guardarEmpleadosTurnos();
                    modal.remove();
                    renderTurnos();
                    actualizarDisplayTurnoActual();
                    toast("Turno actualizado");

        window.eliminarTurno = async (id) => {
            if (await ensureAdmin() && confirm("¿Eliminar?")) {
                turnos = turnos.filter(t => t.id !== id);
                guardarEmpleadosTurnos();
                renderTurnos();
                actualizarDisplayTurnoActual();
                toast("Turno eliminado");
            }

        window.marcarPagadoEmpleado = (empId) => {
            const emp = empleados.find(e => e.id === empId);
            if (!emp) return;
            if (emp.estadoPago === 'pagado') {
                if (confirm(`El empleado ${emp.nombre} ya está Pagado. ¿Cambiar a Pendiente?`)) {
                    emp.estadoPago = 'pendiente';
                    saveAll();
                    renderTurnos();
                    toast(`Estado cambiado a Pendiente`);
                }
            } else {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal-card">
                        <h3>💰 Registrar pago a ${escapeHtml(emp.nombre)}</h3>
                        <input type="number" id="montoPago" placeholder="Monto" step="0.01">
                        <input type="text" id="conceptoPago" placeholder="Concepto (ej: Semana 1)">
                        <div style="display:flex; gap:14px; margin-top:18px;">
                            <button id="confirmarPagoBtn" class="btn btn-primary">Pagar y marcar Pagado</button>
                            <button id="cancelarPagoBtn" class="btn btn-outline">Cancelar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelector("#confirmarPagoBtn").onclick = () => {
                    let monto = parseFloat(modal.querySelector("#montoPago").value);
                    let concepto = modal.querySelector("#conceptoPago").value.trim() || "Pago registrado";
                    if (isNaN(monto) || monto <= 0) { toast("Monto inválido", true); return; }
                    if (!emp.pagos) emp.pagos = [];
                    emp.pagos.push({ fecha: new Date().toISOString(), monto, concepto });
                    emp.estadoPago = 'pagado';
                    if (caja.apertura) {
                        caja.movimientos.push({
                            fecha: new Date().toISOString(),
                            tipo: "retiro",
                            monto: monto,
                            descripcion: `Pago a empleado ${emp.nombre}`,
                            metodo: "efectivo"
                        });
                        actualizarSaldoCaja();
                    }
                    saveAll();
                    toast(`Pago de $${monto} registrado. Estado: Pagado ✅`);
                    modal.remove();
                    renderTurnos();
                };
                modal.querySelector("#cancelarPagoBtn").onclick = () => modal.remove();
            }

        window.verHistorialPagosEmpleado = (empId) => {
            const emp = empleados.find(e => e.id === empId);
            if (!emp || !emp.pagos || emp.pagos.length === 0) { toast("Sin pagos registrados", true); return; }
            alert(
                `📜 Historial de pagos de ${emp.nombre}:\n${emp.pagos.map(p => `${new Date(p.fecha).toLocaleString()} - $${p.monto} (${p.concepto})`).join("\n")}`
                );

        function copiarTurnosSemana() {
            if (turnos.length === 0) { toast("No hay turnos", true); return; }
            if (!confirm("¿Copiar todos los turnos a la próxima semana?")) return;
            const nuevosTurnos = turnos.map(t => ({ ...t, id: Date.now() + Math.floor(Math.random() * 10000) }));
            turnos.push(...nuevosTurnos);
            guardarEmpleadosTurnos();
            renderTurnos();
            toast(`✅ Se copiaron ${nuevosTurnos.length} turnos`);
        }

        function exportarTurnosCSV() {
            if (turnos.length === 0) { toast("No hay turnos", true); return; }
            const rows = [
                ["Día", "Hora Inicio", "Hora Fin", "Empleado"]
            ];
            turnos.forEach(t => {
                const emp = empleados.find(e => e.id === t.empleadoId);
                rows.push([diasSemana[t.dia], t.horaInicio, t.horaFin, emp ? emp.nombre : "Empleado eliminado"]);
            });
            const csvContent = rows.map(row => row.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: "text/csv" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "turnos_exportados.csv";
            link.click();
            URL.revokeObjectURL(link.href);
            toast("📎 Turnos exportados a CSV");

        function renderClientes() {
            const tbody = document.getElementById("clientesTableBody");

                    (c.nombre || '').toLowerCase().includes(searchTerm) ||
                    (c.telefono && c.telefono.toLowerCase().includes(searchTerm))
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">${clientes.length === 0 ? 'No hay clientes registrados' : 'No se encontraron clientes'}</td></tr>`;

        function renderMovimientosCredito() {
            const tbody = document.getElementById("movimientosCreditoBody");
            if (!tbody) return;
            const movs = [];
            ventas.forEach(v => {
                if (v.esFiado && !v.devuelta) {
                    const cliente = clientes.find(c => c.id === v.clienteId);
                    movs.push({
                        fecha: v.fecha,
                        cliente: cliente ? cliente.nombre : 'Cliente eliminado',
                        ventaId: v.id,
                        monto: v.total,
                        tipo: 'Venta a crédito',
                        estado: (v.saldoPendiente || 0) > 0 ? `Debe $${(v.saldoPendiente || 0).toFixed(2)}` : 'Pagado'
                    });
                }
            });
            clientes.forEach(c => {
                if (c.historial) {
                    c.historial.forEach(h => {
                        if (h.tipo === 'pago') {
                            movs.push({
                                fecha: h.fecha,
                                cliente: c.nombre || '',
                                ventaId: '-',
                                monto: h.monto,
                                tipo: 'Pago recibido',
                                estado: '✓'
                            });
                        } else if (h.tipo === 'deuda_inicial') {
                            movs.push({
                                fecha: h.fecha,
                                cliente: c.nombre || '',
                                ventaId: '-',
                                monto: h.monto,
                                tipo: 'Deuda inicial',
                                estado: 'Pendiente'
                            });
                        } else if (h.tipo === 'deuda_manual') {
                            movs.push({
                                fecha: h.fecha,
                                cliente: c.nombre || '',
                                ventaId: '-',
                                monto: h.monto,
                                tipo: 'Deuda manual',
                                estado: 'Pendiente'
                            });
                        }
                    });
                }
            });
            movs.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            const top = movs.slice(0, 20);
            if (top.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay movimientos de crédito</td></tr>`;
                return;
            }
            tbody.innerHTML = top.map(m => `
                <tr>
                    <td>${new Date(m.fecha).toLocaleString()}</td>
                    <td>${escapeHtml(m.cliente)}</td>
                    <td>${m.ventaId}</td>
                    <td>$${m.monto.toFixed(2)}</td>
                    <td>${m.tipo}</td>
                    <td>${m.estado}</td>
                </tr>
            `).join('');
        }

        window.registrarPagoCliente = (id) => {
            const cliente = clientes.find(c => c.id === id);
            if (!cliente) { toast("Cliente no encontrado", true); return; }
            const deudaActual = cliente.deuda || 0;
            if (deudaActual <= 0) { toast("Este cliente no tiene deuda", true); return; }

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-card" style="max-width:450px;">
                    <h3>💵 Registrar Pago de ${escapeHtml(cliente.nombre || '')}</h3>
                    <p><strong>Deuda actual:</strong> $${deudaActual.toFixed(2)}</p>
                    <label>Monto a pagar</label>
                    <input type="number" id="pagoMonto" placeholder="0.00" step="0.01" min="0.01" value="${deudaActual.toFixed(2)}" style="font-size:1rem;">
                    <label>Descripción (opcional)</label>
                    <input type="text" id="pagoDesc" placeholder="Ej: Pago parcial" style="font-size:1rem;">
                    <label>Método de pago</label>

                    </select>

                        <button id="confirmarPagoCliente" class="btn btn-primary">Registrar Pago</button>
                        <button id="cancelarPagoCliente" class="btn btn-outline">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            modal.querySelector('#confirmarPagoCliente').onclick = () => {
                const monto = parseFloat(modal.querySelector('#pagoMonto').value);
                const desc = modal.querySelector('#pagoDesc').value.trim() || 'Pago registrado';
                if (isNaN(monto) || monto <= 0) { toast("Monto inválido", true); return; }
                if (monto > deudaActual) { toast("El monto no puede superar la deuda", true); return; }

                if (!cliente.historial) cliente.historial = [];
                const metodoPago = modal.querySelector('#pagoMetodo').value;
                cliente.historial.push({
                    tipo: 'pago',
                    fecha: new Date().toISOString(),
                    monto: monto,
                    descripcion: desc,
                    metodo: metodoPago,
                    ventaId: null
                });
                cliente.deuda -= monto;

                if (caja.apertura) {
                    caja.movimientos.push({
                        fecha: new Date().toISOString(),
                        tipo: "ingreso",
                        monto: monto,
                        descripcion: `Pago de cliente ${cliente.nombre}: ${desc}`,
                        metodo: metodoPago
                    });
                    actualizarSaldoCaja();
                }

                const ventasCliente = ventas.filter(v => v.clienteId === id && v.esFiado && !v.devuelta);
                let montoRestante = monto;
                for (let v of ventasCliente) {
                    if (montoRestante <= 0) break;
                    if (v.saldoPendiente === undefined) v.saldoPendiente = v.total;
                    const aplicar = Math.min(montoRestante, v.saldoPendiente);
                    v.saldoPendiente -= aplicar;
                    montoRestante -= aplicar;
                    if (!v.pagos) v.pagos = [];
                    v.pagos.push({
                        fecha: new Date().toISOString(),
                        monto: aplicar,
                        descripcion: desc
                    });
                }

                saveAll();
                toast(`Pago de $${monto.toFixed(2)} registrado a ${cliente.nombre}`);
                modal.remove();
                if (document.getElementById("fiado").classList.contains("active")) renderFiado();
                if (document.getElementById("caja").classList.contains("active")) renderCaja();
                if (document.getElementById("reportes").classList.contains("active")) renderHistorial();
                actualizarHeader();
            };
            modal.querySelector('#cancelarPagoCliente').onclick = () => modal.remove();
        };

        function actualizarEstadisticas(dias) {
            const ahora = new Date();
            const fechaInicio = new Date();
            fechaInicio.setDate(ahora.getDate() - dias);
            fechaInicio.setHours(0, 0, 0, 0);
            const ventasFiltradas = ventas.filter(v => !v.devuelta && new Date(v.fecha) >= fechaInicio);
            const totalVentas = ventasFiltradas.reduce((s, v) => s + v.total, 0);
            const totalGanancia = ventasFiltradas.reduce((s, v) => s + (v.ganancia || 0), 0);
            const ticketPromedio = ventasFiltradas.length ? totalVentas / ventasFiltradas.length : 0;
            const margenPromedio = totalVentas ? (totalGanancia / totalVentas * 100) : 0;
            const rotacionInventario = totalVentas / (productos.reduce((acc, p) => acc + p.stock, 1) / productos.length || 1);

            document.getElementById("statsKpiGrid").innerHTML = `
                <div class="kpi-card"><div class="kpi-title">💰 Ventas período</div><div class="kpi-value">$${totalVentas.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">📈 Ganancia neta</div><div class="kpi-value">$${totalGanancia.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">📊 Margen bruto</div><div class="kpi-value">${margenPromedio.toFixed(1)}%</div></div>
                <div class="kpi-card"><div class="kpi-title">🎫 Ticket promedio</div><div class="kpi-value">$${ticketPromedio.toFixed(2)}</div></div>
                <div class="kpi-card"><div class="kpi-title">🔄 Rotación stock</div><div class="kpi-value">${rotacionInventario.toFixed(1)}</div></div>
            `;

            let fechasMap = new Map();
            for (let d = new Date(fechaInicio); d <= ahora; d.setDate(d.getDate() + 1)) {
                let key = d.toISOString().split('T')[0];
                fechasMap.set(key, { ventas: 0, ganancia: 0, margen: 0 });
            }
            ventasFiltradas.forEach(v => {
                let key = new Date(v.fecha).toISOString().split('T')[0];
                if (fechasMap.has(key)) {
                    let item = fechasMap.get(key);
                    item.ventas += v.total;
                    item.ganancia += v.ganancia || 0;
                    if (item.ventas > 0) item.margen = (item.ganancia / item.ventas) * 100;
                }
            });
            let sortedDates = Array.from(fechasMap.keys()).sort();
            let ventasData = sortedDates.map(d => fechasMap.get(d).ventas);
            let gananciasData = sortedDates.map(d => fechasMap.get(d).ganancia);
            let margenData = sortedDates.map(d => fechasMap.get(d).margen);
            let labels = sortedDates.map(d => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short' }));

            if (lineChartVentas) lineChartVentas.destroy();
            let ctxLine = document.getElementById('statsLineChart')?.getContext('2d');
            if (ctxLine) lineChartVentas = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{ label: 'Ventas ($)', data: ventasData, borderColor: '#d63384',
                        backgroundColor: 'rgba(214,51,132,0.1)', tension: 0.3, fill: true }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            if (dualAxisChart) dualAxisChart.destroy();
            let ctxDual = document.getElementById('statsDualAxisChart')?.getContext('2d');
            if (ctxDual) dualAxisChart = new Chart(ctxDual, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ventas ($)', data: ventasData, backgroundColor: '#d63384' },
                        { label: 'Ganancia ($)', data: gananciasData, backgroundColor: '#f59e0b' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } }
            });

            if (marginLineChart) marginLineChart.destroy();
            let ctxMargin = document.getElementById('statsMarginLineChart')?.getContext('2d');
            if (ctxMargin) marginLineChart = new Chart(ctxMargin, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{ label: 'Margen %', data: margenData, borderColor: '#dc2626',
                        backgroundColor: 'rgba(220,38,38,0.1)', tension: 0.3 }]
                },
                options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true,
                        max: 100 } } }
            });

            let productProfitMap = new Map();
            ventasFiltradas.forEach(v => {
                v.items.forEach(item => {
                    let profit = (item.precioUnitario - (productos.find(p => p.id === item.id)?.costo ||
                    0)) * item.cantidad;
                    productProfitMap.set(item.nombre, (productProfitMap.get(item.nombre) || 0) + profit);
                });
            });
            let topProfit = Array.from(productProfitMap.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);
            if (profitProductChart) profitProductChart.destroy();
            let ctxProfit = document.getElementById('statsProfitProductChart')?.getContext('2d');
            if (ctxProfit) profitProductChart = new Chart(ctxProfit, {
                type: 'bar',
                data: {
                    labels: topProfit.map(p => p[0]),
                    datasets: [{ label: 'Ganancia ($)', data: topProfit.map(p => p[1]),
                        backgroundColor: '#10b981' }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            let hourData = new Array(24).fill(0);
            ventasFiltradas.forEach(v => { let hour = new Date(v.fecha).getHours();
                hourData[hour] += v.total; });
            if (heatmapChart) heatmapChart.destroy();
            let ctxHeat = document.getElementById('statsHeatmapChart')?.getContext('2d');
            if (ctxHeat) heatmapChart = new Chart(ctxHeat, {
                type: 'bar',
                data: {
                    labels: Array.from({ length: 24 }, (_, i) => `${i}:00`),
                    datasets: [{ label: 'Ventas por hora ($)', data: hourData, backgroundColor: '#8b5cf6' }]
                },
                options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } }
            });

            let nowDate = new Date();
            let currentMonth = nowDate.getMonth();
            let currentYear = nowDate.getFullYear();
            let prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
            let prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            let currentMonthSales = ventas.filter(v => !v.devuelta && new Date(v.fecha).getMonth() === currentMonth &&
                new Date(v.fecha).getFullYear() === currentYear).reduce((a, b) => a + b.total, 0);
            let prevMonthSales = ventas.filter(v => !v.devuelta && new Date(v.fecha).getMonth() === prevMonth && new Date(
                v.fecha).getFullYear() === prevYear).reduce((a, b) => a + b.total, 0);
            if (monthCompareChart) monthCompareChart.destroy();
            let ctxMonth = document.getElementById('statsMonthCompareChart')?.getContext('2d');
            if (ctxMonth) monthCompareChart = new Chart(ctxMonth, {
                type: 'bar',
                data: {
                    labels: ['Mes Actual', 'Mes Anterior'],
                    datasets: [{ label: 'Ventas ($)', data: [currentMonthSales, prevMonthSales],
                        backgroundColor: ['#d63384', '#64748b'] }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            let productUnits = new Map();
            ventasFiltradas.forEach(v => {
                v.items.forEach(item => {
                    productUnits.set(item.nombre, (productUnits.get(item.nombre) || 0) + item.cantidad);
                });
            });
            let topUnits = Array.from(productUnits.entries()).sort((a, b) => b[1] - a[1]).slice(0, 5);
            if (barChartTopProductos) barChartTopProductos.destroy();
            let ctxBar = document.getElementById('statsBarChart')?.getContext('2d');
            if (ctxBar) barChartTopProductos = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: topUnits.map(p => p[0]),
                    datasets: [{ label: 'Unidades vendidas', data: topUnits.map(p => p[1]),
                        backgroundColor: '#f59e0b' }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            let methodMap = new Map();
            ventasFiltradas.forEach(v => {
                let m = v.metodoPago || 'efectivo';
                methodMap.set(m, (methodMap.get(m) || 0) + v.total);
            });
            if (pieChartMetodos) pieChartMetodos.destroy();
            let ctxPie = document.getElementById('statsPieChart')?.getContext('2d');
            if (ctxPie) pieChartMetodos = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: Array.from(methodMap.keys()),
                    datasets: [{ data: Array.from(methodMap.values()), backgroundColor: ['#d63384',
                            '#f59e0b', '#10b981', '#dc2626'
                        ] }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            // Gráfico por empleado
            let employeeSales = new Map();
            empleados.forEach(emp => {
                if (emp.activo) employeeSales.set(emp.id, { nombre: emp.nombre, total: 0, count: 0 });
            });
            employeeSales.set('sin_asignar', { nombre: 'Sin asignar', total: 0, count: 0 });

            ventasFiltradas.forEach(v => {
                const id = v.vendedorId || 'sin_asignar';
                if (employeeSales.has(id)) {
                    const data = employeeSales.get(id);
                    data.total += v.total;
                    data.count++;
                } else {
                    const sinAsignar = employeeSales.get('sin_asignar');
                    sinAsignar.total += v.total;
                    sinAsignar.count++;
                }
            });

            const empData = Array.from(employeeSales.values()).filter(d => d.total > 0);
            const empLabels = empData.map(d => d.nombre);
            const empTotals = empData.map(d => d.total);

            if (employeeBarChart) employeeBarChart.destroy();
            let ctxEmp = document.getElementById('employeeBarChart')?.getContext('2d');
            if (ctxEmp) {
                if (empData.length === 0) {
                    ctxEmp.clearRect(0, 0, ctxEmp.canvas.width, ctxEmp.canvas.height);
                    ctxEmp.fillStyle = '#94a3b8';
                    ctxEmp.font = '14px system-ui';
                    ctxEmp.fillText('Sin ventas en el período', 20, 100);
                } else {
                    employeeBarChart = new Chart(ctxEmp, {
                        type: 'bar',
                        data: {
                            labels: empLabels,
                            datasets: [{
                                label: 'Total Ventas ($)',
                                data: empTotals,
                                backgroundColor: '#d63384',
                                borderRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: function(ctx) {
                                            const data = employeeSales.get(
                                                empleados.find(e => e.nombre === ctx.label)?.id || 'sin_asignar');
                                            const count = data ? data.count : 0;
                                            return `$${ctx.raw.toFixed(2)} (${count} ventas)`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: { beginAtZero: true }
                            }
                        }
                    });
                }
            }

            let bestEmp = null;
            let bestTotal = 0;
            for (let [key, val] of employeeSales) {
                if (val.total > bestTotal && key !== 'sin_asignar') {
                    bestTotal = val.total;
                    bestEmp = val.nombre;
                }
            }
            let insightMsg = "";
            if (margenPromedio < 30) insightMsg = "⚠️ Margen de ganancia bajo (<30%). Revisa precios de costo.";
            else if (margenPromedio > 60) insightMsg = "✅ Excelente margen de ganancia. ¡Sigue así!";
            else insightMsg = "📊 Margen saludable. Considera promociones para aumentar volumen.";
            if (ticketPromedio < 1000) insightMsg += " Ticket promedio bajo. Sugiere combos.";
            else if (ticketPromedio > 5000) insightMsg += " Ticket promedio alto. Ofrece programas de fidelidad.";
            if (bestEmp) insightMsg += ` 🏆 Empleado destacado: ${bestEmp} con $${bestTotal.toFixed(2)} en ventas.`;
            document.getElementById("insightsText").innerText = insightMsg;
            toast("Estadísticas actualizadas correctamente");
        }

        function renderHistorial() {
            let html = `
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
                    <input type="date" id="fechaDesde" style="padding:10px; border-radius:12px; font-size:0.95rem;">

                    <input type="text" id="filtroHistorial" placeholder="Buscar..." style="padding:10px; border-radius:12px; font-size:0.95rem; flex:1;">
                    <button id="exportCSVBtn" class="btn btn-outline">Exportar CSV</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>Fecha</th><th>Productos</th><th>Total</th><th>Tipo</th><th>Método</th><th>Vendedor</th><th>Devuelta</th><th>Acciones</th></tr></thead>
                        <tbody id="historialBody"></tbody>
                    </table>
                </div>

                <hr>
                <h3>🗑️ Auditoría de eliminaciones (robos hormiga)</h3>
                <div style="margin-bottom:12px; display:flex; gap:10px; flex-wrap:wrap;">
                    <button id="limpiarAuditoriaBtn" class="btn btn-danger">🧹 Limpiar auditoría</button>
                    <button id="exportarAuditoriaBtn" class="btn btn-outline">📎 Exportar CSV</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>Fecha</th><th>Vendedor</th><th>Items</th><th>Total</th><th>Motivo</th></tr></thead>
                        <tbody id="auditoriaBody"></tbody>
                    </table>
                </div>
            `;
            document.getElementById("reportes").innerHTML = html;

            function cargarHistorial() {
                let filtroTexto = document.getElementById("filtroHistorial")?.value.toLowerCase() || "";
                let desde = document.getElementById("fechaDesde")?.value;
                let hasta = document.getElementById("fechaHasta")?.value;
                let filtradas = ventas.filter(v => {
                    let matchTexto = v.items.some(i => i.nombre.toLowerCase().includes(filtroTexto));
                    let fecha = new Date(v.fecha);
                    let matchFecha = true;
                    if (desde) matchFecha = matchFecha && fecha >= new Date(desde);
                    if (hasta) { let end = new Date(hasta);
                        end.setHours(23, 59, 59);
                        matchFecha = matchFecha && fecha <= end; }
                    return matchTexto && matchFecha;
                });
                let tbody = document.getElementById("historialBody");
                tbody.innerHTML = filtradas.map(v => {
                    let devuelta = v.devuelta ? '✅ Sí' : '❌ No';
                    let vendedor = 'Sin asignar';
                    if (v.vendedorId) {
                        const emp = empleados.find(e => e.id === v.vendedorId);
                        if (emp) vendedor = emp.nombre;
                    }
                    let metodoDisplay = v.metodoPago === 'mixto' ? 'Mixto' : (v.metodoPago || 'Efectivo');
                    let metodosDetalle = '';
                    if (v.pagoMixto && v.pagoMixto.length) {
                        metodosDetalle = ' (' + v.pagoMixto.map(m => `${m.metodo}: $${m.monto}`).join(' + ') + ')';
                    }
                    let tipo = v.esFiado ? 'Crédito' : 'Contado';
                    return `<tr>
                        <td>${new Date(v.fecha).toLocaleString()}</td>
                        <td>${escapeHtml(v.items.map(i=>`${i.cantidad} ${i.nombre}`).join(', '))}</td>
                        <td>$${v.total}</td>
                        <td>${tipo}</td>
                        <td>${escapeHtml(metodoDisplay)}${metodosDetalle}</td>
                        <td>${escapeHtml(vendedor)}</td>
                        <td>${devuelta}</td>
                        <td>${!v.devuelta?`<button class="btn btn-danger" onclick="devolverVenta(${v.id})">Devolver</button>`:'Devuelta'}</td>
                    </tr>`;
                }).join('');
            }

            function cargarAuditoria() {
                const tbody = document.getElementById('auditoriaBody');
                if (!tbody) return;
                if (auditoriaBorrados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No hay registros de eliminaciones</td></tr>`;
                    return;
                }
                tbody.innerHTML = auditoriaBorrados.slice().reverse().map(item => {
                    let itemsStr = item.items.map(i => `${i.cantidad} ${i.nombre}`).join(', ');
                    return `<tr>
                        <td>${new Date(item.fecha).toLocaleString()}</td>
                        <td>${escapeHtml(item.vendedor)}</td>
                        <td>${escapeHtml(itemsStr)}</td>
                        <td>$${item.total.toFixed(2)}</td>
                        <td>${escapeHtml(item.motivo)}</td>
                    </tr>`;
                }).join('');
            }

            document.getElementById("filtroHistorial")?.addEventListener("input", cargarHistorial);
            document.getElementById("fechaDesde")?.addEventListener("change", cargarHistorial);
            document.getElementById("fechaHasta")?.addEventListener("change", cargarHistorial);

            document.getElementById("exportCSVBtn")?.addEventListener("click", () => {
                let filtradas = ventas.filter(v => true);
                let csvRows = [
                    ["Fecha", "Productos", "Total", "Tipo", "Método", "Vendedor", "Devuelta"]
                ];
                filtradas.forEach(v => {
                    let vendedor = 'Sin asignar';
                    if (v.vendedorId) {
                        const emp = empleados.find(e => e.id === v.vendedorId);
                        if (emp) vendedor = emp.nombre;
                    }
                    let tipo = v.esFiado ? 'Crédito' : 'Contado';
                    csvRows.push([new Date(v.fecha).toLocaleString(), v.items.map(i => `${i.cantidad} ${i.nombre}`)
                        .join(';'), v.total, tipo, v.metodoPago ||
                        'Efectivo', vendedor, v.devuelta ? "Sí" : "No"
                    ]);
                });
                let csvContent = csvRows.map(row => row.map(csvField).join(",")).join("\n");
                let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8" });
                let a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "ventas_filtradas.csv";
                a.click();
                toast("CSV exportado");
            });

            document.getElementById("limpiarAuditoriaBtn")?.addEventListener("click", async () => {
                if (!await ensureAdmin()) return;
                if (!confirm("¿Eliminar todo el historial de auditoría?")) return;
                auditoriaBorrados = [];
                saveAll();
                cargarAuditoria();
                toast("Auditoría limpiada");
            });

            document.getElementById("exportarAuditoriaBtn")?.addEventListener("click", () => {
                if (auditoriaBorrados.length === 0) { toast("No hay datos", true); return; }
                let rows = [
                    ["Fecha", "Vendedor", "Items", "Total", "Motivo"]
                ];
                auditoriaBorrados.forEach(item => {
                    let itemsStr = item.items.map(i => `${i.cantidad} ${i.nombre}`).join(';');
                    rows.push([new Date(item.fecha).toLocaleString(), item.vendedor, itemsStr, item.total,
                        item.motivo
                    ]);
                });
                let csvContent = rows.map(row => row.map(csvField).join(",")).join("\n");
                let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8" });
                let a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "auditoria_borrados.csv";
                a.click();
                toast("Auditoría exportada");
            });

            cargarHistorial();
            cargarAuditoria();
        }

        // ===== DEVOLVER VENTA =====
        window.devolverVenta = async (idVenta) => {
            if (!await ensureAdmin()) return;
            let venta = ventas.find(v => v.id === idVenta);
            if (!venta || venta.devuelta) { toast("Venta no válida", true); return; }
            if (!confirm(`¿Devolver venta de $${venta.total}?`)) return;
            for (let item of venta.items) {
                let prod = productos.find(p => p.id === item.id);
                if (prod && !item.esSuelta) prod.stock += item.cantidad;
            }
            if (!venta.esFiado && caja.apertura) {
                const pagos = venta.pagoMixto;
                if (pagos && pagos.length > 0) {
                    const totalPagado = pagos.reduce((s, m) => s + m.monto, 0);
                    for (let m of pagos) {
                        const proporcion = totalPagado > 0 ? m.monto / totalPagado : 0;
                        const montoADevolver = Math.round(venta.total * proporcion * 100) / 100;
                        if (montoADevolver <= 0) continue;
                        caja.movimientos.push({
                            fecha: new Date().toISOString(),
                            tipo: "retiro",
                            monto: montoADevolver,
                            descripcion: `Devolución venta #${venta.id} (${m.metodo})`,
                            metodo: m.metodo
                        });
                    }
                } else {
                    caja.movimientos.push({
                        fecha: new Date().toISOString(),
                        tipo: "retiro",
                        monto: venta.total,
                        descripcion: `Devolución venta #${venta.id}`,
                        metodo: "efectivo"
                    });
                }
                actualizarSaldoCaja();
            }
            venta.devuelta = true;
            if (venta.esFiado && venta.clienteId) {
                const cliente = clientes.find(c => c.id === venta.clienteId);
                if (cliente) {
                    cliente.deuda -= venta.total;
                    if (cliente.deuda < 0) cliente.deuda = 0;
                    if (cliente.historial) {
                        cliente.historial.push({
                            tipo: 'devolucion',
                            fecha: new Date().toISOString(),
                            monto: venta.total,
                            descripcion: `Devolución venta #${venta.id}`
                        });
                    }
                }
            }
            productos.forEach(p => p.ventasTotales = ventas.filter(v => !v.devuelta).reduce((acc, v) => acc + (v.items
                .filter(i => i.id === p.id).reduce((s, i) => s + i.cantidad, 0)), 0));
            caja._version = Date.now() + Math.random();
            saveAll();
            toast("Venta devuelta");
            refreshCurrentTab();
        };
